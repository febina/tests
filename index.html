  S.papers[n].at.push({s:sc,t:all.length,w:Object.keys(wl)});save();const r=document.createElement('div');r.className='card';r.innerHTML=`<h2>🎉 Score: ${sc} / ${all.length}</h2><p>Practice score only, not an official mark. Topics to revisit:</p>${Object.keys(wl).length?Object.keys(wl).map(i=>`<a class="pill" href="#/lesson/${i}">${L_(i).t} (${wl[i]} missed)</a>`).join(''):'<p>Brilliant! No topics missed.</p>'}`;r.append(btn('Try again',()=>viewExam(n),'alt'));ps.prepend(r);window.scrollTo(0,0);sub.disabled=true});ps.append(sub)}
/* ---- PROGRESS ---- */
function badgeList(){const o=overall();const lc=LANDS.map(l=>l.ls.length&&l.ls.every(id=>lstats(L_(id)).done));return[['🚀 First mission',o.d>=1],['🔍 Detective HQ',lc[0]],['🌲 Forest',lc[1]],['🏙️ City',lc[2]],['🔧 Workshop',lc[3]],['🧪 Lab',lc[4]],['🎬 Studio',lc[5]],['⭐ 50 stars',S.stars>=50],['✍️ Story saved',S.stories.length>0],['📝 Exam explorer',Object.values(S.papers).some(p=>p.at&&p.at.length)],['📖 Word collector',S.vocab.length>=5],['🗣️ Teacher',Object.values(S.teach).filter(x=>x&&x.length>10).length>=3]]}
function acc(id){let a=0,f=0;Object.values(S.ans).forEach(x=>{if(x.l===id){a++;if(x.first)f++}});return{a,f}}
function viewProgress(){nav('#/progress');const o=overall();let ta=0,tf=0;LESSONS.forEach(l=>{const c=acc(l.id);ta+=c.a;tf+=c.f});
 main().innerHTML=`<h1>📊 My Progress</h1><div class="card"><b>${o.d}/${o.t}</b> missions complete · <b>${ta}</b> questions tried · ⭐ ${S.stars}<div class="bar"><i style="width:${pct(o.d,o.t)}%"></i></div></div><div class="card"><h2>Accuracy by topic (first tries)</h2>${LESSONS.map(l=>{const c=acc(l.id);return`<div class="hbar"><b>${l.t}</b><div class="bar"><i style="width:${pct(c.f,c.a)}%"></i></div><span>${c.a?pct(c.f,c.a)+'%':'–'}</span></div>`}).join('')}</div><div class="card"><h2>🏅 Badges</h2>${badgeList().map(b=>`<span class="badge ${b[1]?'on':''}">${b[0]}</span>`).join('')}</div><div class="card" id="rv"><h2>🔁 Revision mode</h2><p>Practise topics that were tricky first time (or not tried yet).</p></div><div class="card"><h2>📖 My words</h2>${S.vocab.map(v=>`<span class="pill">${esc(v)}</span>`).join('')||'None saved yet.'}</div>`;
 $('#rv').append(btn('Make my revision set',()=>{const w=LESSONS.map(l=>({l,s:acc(l.id)})).map(x=>({...x,r:x.s.a?(x.s.a-x.s.f)/x.s.a:0.5})).sort((a,b)=>b.r-a.r).slice(0,4);const set=[];w.forEach(({l})=>{l.p.concat(l.e).forEach((q,i)=>{const id=l.id+(i<l.p.length?'-p'+i:'-e'+(i-l.p.length));const a=S.ans[id];if(q.t!=='write'&&(!a||!a.first))set.push({q,l:l.id,id})})});const pick=shuffle(set).slice(0,8);const box=document.createElement('div');if(!pick.length)box.textContent='Nothing to revise — try another paper!';pick.forEach(p=>box.append(qCard(p.q,p.l,p.id,L_(p.l).t)));$('#rv').append(box)}))}
/* ---- PRINT ---- */
function viewPrint(){nav('#/print');main().innerHTML='<h1>🖨️ Print</h1><div class="card noprint"><p>Pick something, then press Print.</p></div><div id="pa"></div>';const pa=$('#pa');const bar=main().querySelector('.card');
 bar.append(btn('Revision sheet',()=>{pa.innerHTML='<h1>Revision Sheet</h1>'+LESSONS.map(l=>`<div class="card"><h3>${l.ic} ${l.t}</h3><p>${l.rc}</p><ul>${l.st.map(s=>`<li>${s}</li>`).join('')}</ul></div>`).join('')+'<div class="card"><h3>Punctuation reference</h3><p>, list / extra info · : introduces list or explanation after a complete clause · ; joins two related main clauses · — emphasis or interruption · ( ) extra information · … unfinished or omitted</p><p><b>Editing checklist:</b> capitals · full stops · commas · apostrophes · spelling · sense</p></div>';setTimeout(()=>window.print(),200)}));
 [1,2,3].forEach(n=>bar.append(btn('Paper '+n+' (blank)',()=>{pa.innerHTML=`<h1>Practice Paper ${n}</h1>`+paperQs(n).map(s=>`<h2>${s.n}</h2>${s.pg?`<div class="passage">${s.pg}</div>`:''}`+s.qs.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${q.q}${q.say?`<i>(Adult reads aloud: “${q.say[0]}”)</i>`:''}${q.t==='mc'?'<ul>'+q.o.map(o=>`<li>${o}</li>`).join('')+'</ul>':'<p>Answer: ____________</p>'}</div>`).join('')).join('')+`<h2>Section D — Creative writing</h2><p>${WPROMPTS[n-1][0]}</p><p>${WPROMPTS[n-1][1]}</p>`;setTimeout(()=>window.print(),200)},'alt')));
 [1,2,3].forEach(n=>bar.append(btn('Paper '+n+' answer key',()=>{pa.innerHTML=`<h1>Paper ${n} — Answer key</h1>`+paperQs(n).map(s=>s.qs.map((q,i)=>`<p><b>${s.n.slice(8,9)}${i+1}.</b> ${esc(ansText(q))} — ${q.why}</p>`).join('')).join('');setTimeout(()=>window.print(),200)},'alt')))}
/* ---- GROWN-UPS ---- */
let unlocked=false;
function viewGrown(){nav('#/grownups');if(!unlocked){main().innerHTML='<h1>👩‍🏫 Grown-ups area</h1><div class="card"><p>Quick check: what is 6 × 7?</p><input class="fi" id="gk" aria-label="Answer"> </div>';const go=()=>{if($('#gk').value.trim()==='42'){unlocked=true;viewGrown()}};$('#gk').parentNode.append(btn('Enter',go));$('#gk').onkeydown=e=>{if(e.key==='Enter')go()};return}
 main().innerHTML=`<h1>👩‍🏫 Grown-ups dashboard</h1><div class="card"><h2>Syllabus checklist</h2><p>Mapped from the supplied master brief. No school syllabus was uploaded, so adjust to match your school’s.</p><table><tr><th>Topic</th><th>Status</th><th>Accuracy</th><th>Needs teaching?</th></tr>${SYLL.map(([n,id])=>{const L=L_(id),s=lstats(L),c=acc(id),a=c.a?pct(c.f,c.a):null;return`<tr><td><a href="#/lesson/${id}">${n}</a></td><td>${s.done?'✅ done':s.att?'in progress':'not started'}</td><td>${a===null?'–':a+'%'}</td><td>${a!==null&&a<60?'⚠️ yes':''}</td></tr>`}).join('')}</table></div>
 <div class="card"><h2>Incorrect answers (latest first)</h2>${S.wrong.slice().reverse().slice(0,60).map(w=>`<p><b>${L_(w.l)?L_(w.l).t:w.l}:</b> ${esc(w.q)}<br>Chosen: <span class="bad">${esc(w.given)}</span> · Correct: <span class="good">${esc(w.ans)}</span><br><i>${esc(w.why)}</i></p>`).join('')||'None yet.'}</div>
 <div class="card"><h2>Papers</h2>${[1,2,3].map(n=>{const p=S.papers[n];return`<p>Paper ${n}: ${p&&p.at&&p.at.length?p.at.map(a=>a.s+'/'+a.t).join(', '):'not attempted'}</p>`}).join('')}</div>
 <div class="card"><h2>Stories</h2>${S.stories.map(s=>`<details><summary>${esc(s.t)}</summary><p>${esc(s.x).replace(/\n/g,'<br>')}</p></details>`).join('')||'None saved.'}</div>
 <div class="card"><h2>“Teach it back” answers</h2>${Object.entries(S.teach).filter(e=>e[1]).map(e=>`<p><b>${L_(e[0])?L_(e[0]).t:e[0]}:</b> ${esc(e[1])}</p>`).join('')||'None yet.'}</div>
 <div class="card"><h2>Reset</h2><p>Reset one topic:</p><select id="rt">${LESSONS.map(l=>`<option value="${l.id}">${l.t}</option>`).join('')}</select></div>`;
 const rc=main().lastChild;rc.append(btn('Reset this topic',()=>{const id=$('#rt').value;if(confirm('Reset this topic?')){Object.keys(S.ans).forEach(k=>{if(S.ans[k].l===id)delete S.ans[k]});S.wrong=S.wrong.filter(w=>w.l!==id);delete S.teach[id];delete S.checks[id];save();viewGrown()}},'red'),btn('Reset EVERYTHING',()=>{if(confirm('Erase all progress, stories and answers?')){localStorage.removeItem(KEY);load();viewGrown()}},'red'))}
/* ============ ROUTER ============ */
function route(){const h=location.hash.replace(/^#\//,'').split('/');const m=main();m.innerHTML='';try{if(h[0]==='lesson')viewLesson(h[1]);else if(h[0]==='words')viewWords();else if(h[0]==='studio')viewStudio();else if(h[0]==='exam')viewExam(h[1]?+h[1]:0);else if(h[0]==='progress')viewProgress();else if(h[0]==='print')viewPrint();else if(h[0]==='grownups')viewGrown();else viewHome()}catch(e){m.innerHTML='<div class="card">Something went wrong: '+esc(e.message)+'</div>';console.error(e)}window.scrollTo(0,0)}
if(typeof document!=='undefined'&&document.getElementById('main')){load();stars();window.addEventListener('hashchange',route);route()}
</script>
</body>
