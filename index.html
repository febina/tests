<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Explorer: The Grade 5 Quest</title>
<style>
:root{--ink:#16213e;--bg:#eef3fb;--card:#fff;--line:#d5deee;--blue:#3b5bdb;--sun:#ffc233;--good:#1b7a43;--bad:#b42323;--soft:#e7edff;--c:#3b5bdb}
*{box-sizing:border-box}
body{margin:0;font:18px/1.55 "Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:20}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:10}
.brand{display:flex;gap:10px;align-items:center}.brand .logo{font-size:30px}.brand b{display:block;font-size:19px;line-height:1.1}.brand small{opacity:.8}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:15px;font-weight:600}
nav a:hover,nav a.on{background:#ffffff26}
.starbox{background:var(--sun);color:var(--ink);padding:4px 12px;border-radius:20px;font-weight:800}
main{max-width:1050px;margin:0 auto;padding:18px 16px 60px;outline:none}
h1{font-size:30px;line-height:1.15;margin:.2em 0}h2{font-size:23px;margin:1em 0 .4em}h3{margin:.8em 0 .3em}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin:14px 0}
.hero{background:linear-gradient(120deg,#16213e,#3b5bdb 70%);color:#fff;border-radius:22px;padding:26px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero h1{font-size:34px}.hero p{margin:.3em 0;max-width:560px}
.bar{height:14px;background:#ffffff3a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sun)}
.card .bar{background:#e3e9f6}.card .bar i{background:var(--c)}
.lands{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:16px}
.land{background:#fff;border-radius:18px;border:2px solid var(--line);overflow:hidden}
.land header{position:static;background:var(--c);padding:12px 16px;display:block}
.land header b{font-size:20px}.land ul{list-style:none;margin:0;padding:8px 10px}
.land li a{display:flex;gap:8px;justify-content:space-between;padding:8px 8px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600}
.land li a:hover{background:var(--soft)}
.btn{background:var(--blue);color:#fff;border:2px solid var(--blue);border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:#fff;color:var(--blue)}.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}.btn.red{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #f08c00;outline-offset:2px}
.lh{border-left:10px solid var(--c);padding-left:14px}.lh .sub{margin:0;color:#44506e}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.hook{font-size:22px;background:var(--soft);border-radius:16px;padding:18px}
.step{display:flex;gap:12px;margin:12px 0;align-items:flex-start}.step.hid{display:none}
.step .n{background:var(--c);color:#fff;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.vbox{flex:1 1 150px;border:3px solid var(--c);border-radius:14px;padding:10px 12px;background:#fff}
.vbox b{display:block;color:var(--c)}.vbox span{font-size:16px}
.op{align-self:center;font-size:28px;font-weight:800}
.ex{border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
.ex.tricky{border-color:var(--sun);background:#fff9e6}
.note{background:var(--soft);padding:8px 12px;border-radius:10px;margin-top:8px}
.q{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0;background:#fff}
.q.solved{border-color:var(--good)}
.qt{font-weight:700;margin:0 0 8px}.tag{background:var(--c);color:#fff;font-size:13px;padding:2px 8px;border-radius:10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}.opt.good{border-color:var(--good);background:#e4f5ea}.opt.bad{border-color:var(--bad);background:#fdeaea}
.fb{margin:8px 0;padding:0;border-radius:10px}.fb.ok,.fb.no,.fb.hint{padding:8px 12px}
.fb.ok{background:#e4f5ea;color:#114d2a}.fb.no{background:#fdeaea;color:#7a1414}.fb.hint{background:#fff3c4}
input.fi,textarea,select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:100%}
input.fi{max-width:320px}textarea{min-height:150px}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;padding:6px 8px;border-radius:10px}
.srow.good{background:#e4f5ea}.srow.bad{background:#fdeaea}.srow span.t{flex:1 1 220px}
.chip{border:2px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.passage{background:#fffdf3;border-left:8px solid var(--sun);padding:12px 16px;border-radius:10px;margin:10px 0;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.tile:hover{border-color:var(--blue)}
.pill{display:inline-block;background:var(--soft);border-radius:12px;padding:2px 10px;margin:2px;font-size:15px}
.bad{color:var(--bad)}.good{color:var(--good)}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;font-size:16px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0}.hbar b{width:240px;font-size:15px}.hbar .bar{flex:1}
.map{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:12px 0}
.map div{flex:1 1 150px;background:#fff;border:3px solid var(--c);border-radius:12px;padding:8px;font-size:15px;min-height:calc(var(--h)*1px)}
.map b{display:block;color:var(--c)}
mark{border-radius:6px;padding:0 3px}.m1{background:#d0ebff}.m2{background:#d3f9d8}.m3{background:#ffe3e3}.m4{background:#fff3bf}.m5{background:#e5dbff}.m6{background:#ffd8a8}.m7{background:#c5f6fa}
.story{font-size:19px;line-height:1.75}.story p{margin:.6em 0}
.badge{display:inline-block;background:#fff;border:2px dashed #bbb;color:#777;border-radius:14px;padding:6px 12px;margin:4px;font-weight:700}.badge.on{border:2px solid var(--sun);background:#fff6d6;color:var(--ink)}
.stage-nav{display:flex;justify-content:space-between;flex-wrap:wrap}
.pp{display:none}
@media (max-width:640px){body{font-size:17px}h1{font-size:25px}.hbar b{width:120px}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.tile{transition:transform .08s}.btn:active,.opt:active{transform:scale(.98)}}
@media print{header,.noprint,.btn,.tabs,.skip{display:none!important}body{background:#fff;font-size:12pt}.card,.q{border:1px solid #999;break-inside:avoid}main{max-width:none;padding:0}.pp{display:block}}
</style>

<header class="noprint"><div class="brand"><span class="logo" aria-hidden="true">🧭</span><div><b>English Explorer</b><small>The Grade 5 Quest</small></div></div><nav id="nav" aria-label="Main menu"></nav><div class="starbox" id="starbox" aria-live="polite"></div></header>
<main id="main" tabindex="-1"></main>
<script>
/* ============ HELPERS ============ */
const M=(q,o,a,why,hint)=>({t:'mc',q,o,a,why,hint});
const F=(q,ans,why,hint,say)=>({t:'fill',q,ans,why,hint,say});
const SRT=(q,b,items,why,hint)=>({t:'sort',q,b,items,why,hint});
const W=(q,model,ck,hint)=>({t:'write',q,model,ck,hint});
const V=(boxes,ops)=>`<div class="vrow">${boxes.map((b,i)=>`<div class="vbox" style="--c:${b[2]||'#3b5bdb'}"><b>${b[0]}</b><span>${b[1]}</span></div>${i<boxes.length-1?`<span class="op" aria-hidden="true">${(ops&&ops[i])||'→'}</span>`:''}`).join('')}</div>`;
/* ============ LESSON DATA ============ */
const LESSONS=[
/* ---------- READING ---------- */
{id:'a1',ic:'🕵️',t:'Explicit and implicit meanings',
hook:`Meera stares at dark clouds. She quickly packs her picnic basket and calls her brother to bring the washing inside. The writer never said the word “rain”… so how do you know what is coming?`,
st:[`<b>Explicit meaning</b> = the writer tells us directly. <i>“Meera packed her basket.”</i>`,`<b>Implicit meaning</b> = the writer only hints, and we work it out from clues. Working it out is called <b>inferring</b>.`,`An <b>inference</b> is a conclusion supported by evidence in the text. Detective formula: <b>text clue + what I already know = my inference</b>.`,`A <b>prediction</b> says what might happen next, using clues. A good answer is a full sentence that points to a clue: “I think … because the text says …”.`],
vis:V([['Text clue','“dark clouds … quickly packed her basket”','#3b5bdb'],['What I know','Dark clouds often bring rain','#2f9e44'],['My inference','Meera expects rain soon','#f08c00']],['+','=']),
ex:[[`“Meera packed her picnic basket.”`,`Explicit: it is stated directly.`],[`“Ravi’s hands trembled as he opened the letter.”`,`Implicit: trembling hands + opening a letter suggest Ravi is nervous or worried. The writer never says “nervous”.`],[`Tom slammed the door and said, “I’m fine.”`,`Tricky! His words say fine, but slamming the door is a clue that he is upset. When words and actions disagree, weigh the clues. Another reading could be possible, but this one has the most evidence.`]],
g:M(`<i>Leela’s boots were caked in mud and her hair was dripping.</i> Which inference is best supported?`,[`She had been outside in wet weather.`,`She is a very good singer.`,`She was sleeping.`,`She likes cooking.`],0,`Muddy boots and dripping hair are clues, and we know mud and wet hair often come from rain or puddles.`,`What could make boots muddy and hair wet?`),
p:[SRT(`Passage: <i>Sam pulled his red coat tight and blew on his fingers.</i> Sort each statement.`,['Explicit (stated)','Inference (worked out)'],[[`Sam wore a red coat.`,0],[`Sam blew on his fingers.`,0],[`Sam felt cold.`,1],[`It was probably a chilly day.`,1]],`Explicit statements are written in the text. “Felt cold” and “chilly day” are worked out from the clues.`),
M(`<i>The classroom fell silent when Mr Rao held up the torn test papers. Nobody looked at him.</i> Which is the strongest inference?`,[`The class felt uneasy or guilty.`,`The class loved the papers.`,`Mr Rao was a pilot.`,`It was snowing.`],0,`Silence and avoiding eye contact are clues for unease. The other answers have no evidence.`),
M(`<i>Asha stood by the stage. Her hands shook as she checked her notes again. A green ribbon held her hair.</i> Which words best support “Asha was nervous”?`,[`A green ribbon held her hair`,`Her hands shook as she checked her notes again`,`Asha stood by the stage`,`She was a girl`],1,`Shaking hands and checking notes again are behaviours of someone nervous. The ribbon tells us nothing about feelings.`),
F(`A conclusion that is supported by clues in the text is called an ______.`,['inference'],`An inference is worked out from evidence.`,`It starts with “in”.`),
M(`<i>Dark clouds covered the sky and Meera quickly packed her basket.</i> What is the most sensible prediction?`,[`It will probably rain soon.`,`Meera will go swimming.`,`It will be sunny all day.`,`Meera will fly away.`],0,`A prediction must match the clues: dark clouds and hurrying suggest rain.`)],
e:[M(`<i>Kabir kept glancing at the clock. When the bell finally rang, he grabbed his bag and sprinted out.</i> Which inference is best supported?`,[`Kabir was eager to leave.`,`Kabir loves clocks.`,`Kabir was asleep.`,`Kabir was angry with the bell.`],0,`Glancing at the clock and sprinting out are clues that he wanted to go.`),
M(`<i>“I’m not scared,” whispered Priya, gripping the rail tightly.</i> What does her action suggest?`,[`She may actually be scared.`,`She is hungry.`,`She is very brave and calm.`,`She wants to sing.`],0,`Her words say one thing but whispering and gripping tightly are clues to fear.`),
M(`<i>Tara found a rusty key under the mat. It had not been used for years.</i> Which is stated directly (explicit)?`,[`Tara found a key under the mat.`,`Someone forgot the key.`,`The key will open the door.`,`Tara is a thief.`],0,`Only the first is written in the passage. The rest are guesses.`)],
rc:`Explicit = stated. Implicit = hinted. An inference is clue + what I know, and it must be backed by evidence.`,ck:[`I can tell explicit from implicit.`,`I can use “clue + what I know”.`,`I can quote the words that support my answer.`]},

{id:'a2',ic:'📚',t:'Interesting words, synonyms and context clues',
hook:`Happy, pleased, delighted, overjoyed. You win a gold medal. Which word shows your feeling best? They all mean “happy”, but they are not the same strength!`,
st:[`<b>Synonyms</b> are words with similar meanings. They often have different strengths (shades of meaning).`,`Choose the word that <b>fits the sentence</b>, not just any word from a list. “The soup was <i>delighted</i>” does not make sense.`,`<b>Context clues</b>: read the words and sentences around an unknown word. They often explain it.`,`<b>Word parts</b> help too: families like <i>break, breakable, unbreakable</i> share a base word, and prefixes (un-, dis-) and suffixes (-ful, -less) change meaning.`],
vis:V([['happy','a little','#3b5bdb'],['pleased','good','#2f9e44'],['delighted','very','#f08c00'],['overjoyed','huge!','#d6336c']]),
ex:[[`tired → weary → exhausted`,`Exhausted is the strongest. Use it after a marathon, not after a short walk.`],[`“The cave was so murky that Ben could barely see his hand.”`,`Clue: “could barely see”. So <b>murky</b> means dark and unclear.`],[`walk → stroll / stride / trudge`,`Tricky: <i>trudge</i> means walking slowly and heavily. “She trudged happily” sounds odd. The word must match the mood.`]],
g:M(`Which word best fits? <i>Ria won the world championship and was ___ .</i>`,[`content`,`fine`,`overjoyed`,`worried`],2,`A world championship is a huge win, so the strongest happy word fits best.`,`Think of the size of the event.`),
p:[M(`Which word is closest in meaning to <b>enormous</b>?`,[`huge`,`tiny`,`ordinary`,`noisy`],0,`Enormous means extremely big, like huge.`),
M(`<i>The cave was so murky that Ben could barely see his own hand.</i> What does <b>murky</b> mean?`,[`dark and hard to see through`,`bright`,`very cold`,`very wet`],0,`The clue “could barely see” tells us.`),
M(`Which word does NOT fit? <i>The ___ child tiptoed quietly into the room.</i>`,[`timid`,`shy`,`nervous`,`furious`],3,`Tiptoeing quietly suggests a timid or shy child, not a furious one.`),
F(`Write a stronger verb than “said” that means spoke very quietly (starts with w).`,['whispered','whisper','whispers'],`Whispered means said very quietly.`,`Think of what you do in a library.`),
M(`Which word is from the same word family as <b>unbreakable</b>?`,[`breakage`,`brakes`,`brick`,`bread`],0,`Unbreakable comes from the base word “break”, and so does breakage.`)],
e:[M(`<i>The chef was famished after cooking all day.</i> Which word is closest in meaning to <b>famished</b>?`,[`very hungry`,`very sleepy`,`very proud`,`very cold`],0,`Cooking all day links to food; famished means very hungry.`),
M(`Choose the best word: <i>The ___ storm shook the windows all night.</i>`,[`gentle`,`fierce`,`tiny`,`polite`],1,`Shaking windows all night needs a strong, powerful word.`),
M(`<i>“Not yet, I’m not ready,” the scientist kept saying.</i> She was <b>reluctant</b> to share her results. Reluctant means:`,[`unwilling`,`eager`,`angry`,`confused`],0,`Her repeated “not yet” is the context clue for unwilling.`)],
rc:`Synonyms share meaning but differ in strength. Context and word parts help me work out new words.`,ck:[`I can pick the synonym that fits the sentence.`,`I can use context clues.`,`I can use word families to work out meaning.`]},

{id:'a3',ic:'⚖️',t:'Fact versus opinion',
hook:`“Friday is the best day of the week.” Can you prove it with a ruler, a clock or a book? What about “A week has seven days”?`,
st:[`A <b>fact</b> can be checked using reliable evidence (a book, a measurement, an official record).`,`An <b>opinion</b> is a belief, feeling, preference or judgement. Words like <i>best, worst, boring, beautiful, should</i> are clues, but always check the whole idea.`,`Some sentences have <b>both</b>: a fact followed by an opinion.`,`An opinion can be backed up by facts, but it does <b>not</b> turn into a fact because many people believe it. Ask: <b>How could I check this?</b>`],
vis:V([['FACT 🧺','Can be checked: “A week has seven days.”','#2f9e44'],['OPINION 🧺','Depends on feelings: “Friday is the best day.”','#d6336c']],['vs']),
ex:[[`“A week has seven days.”`,`Fact. You can check any calendar.`],[`“Friday is the best day of the week.”`,`Opinion. People can disagree.`],[`“The library has 500 books, making it the best library in town.”`,`Tricky! The first part is a factual claim you can count. “The best library” is an opinion.`]],
g:M(`“Water boils at 100 °C at sea level.” Fact or opinion?`,[`Fact`,`Opinion`],0,`It can be checked by experiment and in science books.`,`Can I test or look it up?`),
p:[SRT(`Put each sentence in a basket.`,['Fact','Opinion'],[[`Mumbai is a city in India.`,0],[`Cricket is more exciting than football.`,1],[`The Moon orbits the Earth.`,0],[`Maths homework is boring.`,1],[`Honey is made by bees.`,0]],`Facts can be checked. Words like “more exciting” and “boring” show feelings.`),
M(`“This is the most delicious mango ever!” is a…`,[`fact`,`opinion`],1,`“Most delicious” is a personal judgement.`),
M(`<i>Our school has 300 students, so it is the friendliest school.</i> Which part is an opinion?`,[`has 300 students`,`the friendliest school`,`both parts`,`neither part`],1,`You can count students (fact), but “friendliest” is a judgement.`),
M(`If lots of people believe an opinion, does it become a fact?`,[`Yes`,`No`],1,`Facts are checked with evidence, not by how many people agree.`),
F(`A statement that can be checked with evidence is called a ______.`,['fact'],`A fact can be proved or checked.`,`Opposite of opinion.`)],
e:[M(`<i>“Buy FizzUp! It has 20% less sugar and tastes amazing.”</i> Which part is a checkable fact claim?`,[`has 20% less sugar`,`tastes amazing`,`Buy FizzUp!`,`none of it`],0,`The sugar amount can be checked. “Tastes amazing” is an opinion.`),
M(`Which statement is an opinion?`,[`Mars is the fourth planet from the Sun.`,`Mars is the most interesting planet.`,`Mars has two moons.`,`Mars looks red.`],1,`“Most interesting” depends on who you ask.`),
M(`What is the best way to check a fact?`,[`Ask a friend to guess`,`Use a reliable source`,`Say it louder`,`Choose the answer you like`],1,`Reliable sources like encyclopaedias and official records give evidence.`)],
rc:`Fact = can be checked. Opinion = belief or judgement. Some sentences have both.`,ck:[`I can sort fact and opinion.`,`I can spot mixed sentences.`,`I can explain how to check a fact.`]},

{id:'a4',ic:'🗝️',t:'Reading detective missions',
pg:`<b>The Lost Lighthouse Key</b><br>Nadia had waited all summer to visit the old lighthouse on Pebble Point. When she arrived, the iron door was locked, and the keeper’s cottage was silent. “The key always hangs by the door,” her grandfather muttered, but the hook was empty. Nadia noticed fresh muddy footprints leading towards the cliff path. They were small, and one boot had a zigzag pattern. “The lighthouse is the most beautiful place in the world,” Nadia declared, though her stomach fluttered. She followed the footprints, determined to solve the puzzle before the tide rose and covered the path.`,
hook:`A lighthouse. An empty hook. Muddy footprints. Time to combine every reading skill you know in one detective mission!`,
st:[`Read the passage twice: once for the story, once for clues.`,`<b>Literal questions</b>: find the exact words. <b>Inference questions</b>: use clue + what you know.`,`<b>Vocabulary</b>: use context. <b>Fact/opinion</b>: ask “can it be checked?”. <b>Writer’s choices</b>: ask what feeling or picture the words create.`,`Always answer in a full sentence, give evidence from the text, and explain your thinking.`],
vis:V([['1 Read','Skim for the story','#3b5bdb'],['2 Clues','Underline evidence','#2f9e44'],['3 Think','Clue + what I know','#f08c00'],['4 Answer','Full sentence + proof','#d6336c']]),
ex:[[`Literal: “Where was the key usually kept?”`,`Answer: on a hook by the door. The words are in the text.`],[`Inference: “Why did Nadia’s stomach flutter?”`,`She was probably nervous or excited. Clue: she was following footprints into possible danger.`],[`Tricky: “The lighthouse is the most beautiful place in the world.”`,`Nadia says it, but it is an opinion, not a fact about the lighthouse.`]],
g:M(`Where did the grandfather expect to find the key?`,[`On a hook by the door`,`Under the cliff`,`In the cottage kitchen`,`In Nadia’s bag`],0,`The text says “The key always hangs by the door” and mentions the hook.`,`Look at what the grandfather muttered.`),
p:[M(`Why did Nadia’s stomach flutter?`,[`She was hungry`,`She felt nervous or excited`,`She was sleepy`,`She disliked the lighthouse`],1,`She was about to follow mysterious footprints. “Fluttered” suggests nervous energy.`),
M(`What does <b>determined</b> mean in the passage?`,[`firmly decided`,`confused`,`tired`,`bored`],0,`She followed the footprints before the tide rose, so she had firmly decided.`),
SRT(`Sort these sentences from the passage.`,['Fact','Opinion'],[[`The iron door was locked.`,0],[`The lighthouse is the most beautiful place in the world.`,1],[`The hook was empty.`,0]],`The door and hook can be checked in the story. “Most beautiful” is a judgement.`),
M(`Why does the writer say “the keeper’s cottage was silent”?`,[`To create a quiet, slightly mysterious mood`,`To show the cottage was noisy`,`To say the cottage was huge`,`To describe the weather`],0,`Silence makes the place feel empty and mysterious.`),
M(`Which is stated directly (explicit)?`,[`The footprints were small.`,`A child made the footprints.`,`The thief had escaped.`,`Nadia was brave.`],0,`Only the first is written in the text.`)],
e:[M(`Which words best prove the footprints were recent?`,[`iron door was locked`,`fresh muddy footprints`,`old lighthouse`,`zigzag pattern`],1,`“Fresh” tells us they were new.`),
M(`What will Nadia most likely do next?`,[`Follow the footprints along the cliff path`,`Go home to sleep`,`Paint the lighthouse`,`Throw away the key`],0,`She is determined and the tide is a deadline.`),
F(`The word “muttered” suggests that her grandfather spoke ______ (loudly or quietly?).`,['quietly','softly','in a low voice','low'],`To mutter is to speak in a low voice.`,`Think of mumbling.`)],
rc:`Combine skills: find clues, infer, use context for words, check facts, and explain with evidence.`,ck:[`I can find evidence for my answer.`,`I can answer inference questions.`,`I can explain the writer’s word choice.`]},
/* ---------- FIGURATIVE ---------- */
{id:'b1',ic:'🌳',t:'Simile',
hook:`“Her smile was as bright as the sun.” Is her smile really a sun? Why would a writer say this?`,
st:[`A <b>simile</b> compares two <i>different</i> things, usually using <b>like</b> or <b>as … as</b>.`,`It does not mean the words literally. It paints a picture: her smile is warm and shining.`,`Careful: not every “like” is a simile. “I like pizza” has no comparison, and “I would like some water” uses “like” to mean “want”.`,`Ask: Are two different things being compared to show what something is like?`],
vis:V([['Literal','Her smile was happy.','#2f9e44'],['Simile','Her smile was as bright as the sun.','#f08c00']],['vs']),
ex:[[`“Her smile was as bright as the sun.”`,`Compares a smile and the sun to show warmth.`],[`“The kitten moved like a shadow.”`,`Silent and smooth.`],[`“I like apples.” / “I would like some water.”`,`Tricky! Neither is a simile. “Like” here means “enjoy” or “want”; nothing is being compared.`]],
g:M(`Which sentence is a simile?`,[`The snow was a white blanket.`,`The snow lay like a soft white blanket.`,`The snow was heavy.`,`I like snow.`],1,`It compares snow with a blanket using “like”. The first is a metaphor.`,`Look for “like” or “as … as” and two different things.`),
p:[SRT(`Sort each sentence.`,['Simile','Not a simile'],[[`The runner was as fast as lightning.`,0],[`I like running.`,1],[`Her voice was like honey.`,0],[`The sky is blue.`,1],[`The moon was a silver coin.`,1]],`“Like honey” and “as fast as lightning” compare different things with like/as. “I like running” and “The sky is blue” compare nothing; “The moon was a silver coin” is a metaphor (no like/as).`),
M(`Complete the simile: <i>The baby was as quiet as a ___ .</i>`,[`mouse`,`drum`,`thunder`,`lorry`],0,`Mice are known for being quiet.`),
M(`<i>The classroom was like a zoo.</i> What does it mean?`,[`It was noisy and wild`,`Animals were in class`,`It was very small`,`It was clean`],0,`The simile compares the noise to a zoo.`),
W(`Write your own simile to describe a stormy sea.`,`The waves crashed like angry giants against the rocks.`,[`I used “like” or “as”.`,`I compared two different things.`,`It fits a stormy sea.`],`Think: what is loud, angry or huge?`),
M(`Why write “as bright as the sun” instead of “she smiled”?`,[`It helps the reader picture her warm, joyful smile`,`It makes the sentence shorter`,`It gives a fact about the sun`,`It is a rule`],0,`Similes create pictures and feelings.`)],
e:[M(`Which sentence contains a simile?`,[`The wind whispered.`,`The bag weighs a ton.`,`The clouds floated like cotton balls.`,`The sun is hot.`],2,`Clouds are compared to cotton balls.`),
M(`“The kitten moved like a shadow.” This tells us the kitten moved…`,[`silently and smoothly`,`noisily`,`slowly like a tortoise`,`in a black coat`],0,`Shadows are silent and smooth.`),
M(`Which sentence uses “like” but is NOT a simile?`,[`He runs like a cheetah.`,`I would like some water.`,`She sang like an angel.`,`It was as light as a feather.`],1,`Here “like” means “want”.`)],
rc:`A simile compares two different things using like or as to create a picture.`,ck:[`I can find similes.`,`I can explain what a simile means.`,`I can write my own simile.`]},

{id:'b2',ic:'🎈',t:'Hyperbole',
hook:`“I’m so hungry I could eat a horse!” Would you really? Why do people say it?`,
st:[`<b>Hyperbole</b> is a deliberate exaggeration used for emphasis or humour.`,`It is not meant literally, and the reader knows that.`,`Test: would this really happen? If not, and it exaggerates a feeling, it is hyperbole.`,`Context matters: “The giant weighs a ton” in a fantasy might be literal. “It rained all day” might be true.`],
vis:V([['Says','My bag weighs a ton!','#d6336c'],['Really','About 5 kg of books','#2f9e44']],['vs']),
ex:[[`“I have told you a million times.”`,`Exaggerates to show frustration.`],[`“My schoolbag weighs a ton.”`,`Shows it feels very heavy.`],[`“It rained all day.”`,`Tricky! This could be true, so it may not be hyperbole.`]],
g:M(`Which is hyperbole?`,[`I’ve told you a million times.`,`I told you twice.`,`I told you yesterday.`,`I forgot to tell you.`],0,`A million is a huge exaggeration.`),
p:[SRT(`Literal or hyperbole?`,['Literal','Hyperbole'],[[`The bag has three books.`,0],[`My bag weighs a ton.`,1],[`I waited forever.`,1],[`The shop opens at nine.`,0],[`I could eat a horse.`,1]],`Hyperbole stretches the truth for effect.`),
M(`Why do writers use hyperbole?`,[`To stress a feeling or add humour`,`To give exact facts`,`To confuse readers`,`To rhyme`],0,`It makes an idea stronger or funnier.`),
M(`“I’m dying of laughter!” Does the speaker really die?`,[`No, it shows something is very funny`,`Yes`],0,`It is hyperbole.`),
W(`Write a hyperbole about a very hot day.`,`It was so hot that the pavement could fry an egg and my ice cream melted in a second.`,[`I exaggerated.`,`It is about heat.`,`It is not meant literally.`]),
M(`Which hyperbole fits a very long queue?`,[`The queue stretched to the moon.`,`The queue had four people.`,`The queue was quiet.`,`The queue was blue.`],0,`It exaggerates the length.`)],
e:[M(`Which is hyperbole?`,[`The classroom was crowded.`,`There were a million people in the classroom.`,`There were 32 children in the room.`,`The room was cold.`],1,`A million is not realistic.`),
M(`“Your room is so messy that a tornado would feel at home.” The effect is…`,[`funny exaggeration`,`a precise fact`,`a polite question`,`a simile`],0,`It exaggerates how messy it is.`),
M(`Which is NOT hyperbole?`,[`I’ve got tonnes of homework.`,`I have homework in three subjects.`,`My homework is mountain high.`,`I’ll be doing homework until I’m 100.`],1,`It is literal.`)],
rc:`Hyperbole is deliberate exaggeration for effect, not literal.`,ck:[`I can spot hyperbole.`,`I can explain its effect.`,`I can write one.`]},

{id:'b3',ic:'🍃',t:'Personification',
hook:`“The wind whispered through the trees.” Can wind talk? What picture does it give you?`,
st:[`<b>Personification</b> gives human actions, feelings or qualities to non-human things.`,`Find (1) the non-human thing and (2) the human quality.`,`It makes writing vivid: a storm can rage, a house can groan.`,`A dog barking or a robot character speaking is not necessarily personification. Ask whether the writer gives a human trait to something not human.`],
vis:V([['Thing','old house','#2f9e44'],['Human action','groaned','#d6336c'],['Effect','creaky, tired, spooky','#3b5bdb']],['+','=']),
ex:[[`“The wind whispered through the trees.”`,`Wind (non-human) + whispered (human).`],[`“The old house groaned in the storm.”`,`Creaking sounds seem like moaning.`],[`“The dog barked.”`,`Tricky! Barking is what dogs do, so it is not personification.`]],
g:M(`“The sun smiled down on us.” Which human quality is given to the sun?`,[`smiling`,`shining`,`being yellow`,`being hot`],0,`Only people smile.`),
p:[SRT(`Personification or not?`,['Personification','Not personification'],[[`The flowers danced in the breeze.`,0],[`The flowers were red.`,1],[`The clock stared at me.`,0],[`The dog ran.`,1],[`The river laughed.`,0]],`Dancing, staring and laughing are human actions given to things.`),
M(`In “The old door complained loudly”, which is the non-human thing?`,[`door`,`complained`,`loudly`,`old`],0,`The door is given the human action of complaining.`),
M(`Which turns “The leaves moved in the wind” into personification?`,[`The leaves waved hello to the wind.`,`The leaves were green.`,`The wind blew.`,`Leaves fall.`],0,`Waving hello is human.`),
W(`Write a personification sentence about the moon.`,`The moon peeked shyly from behind a cloud.`,[`The moon is the non-human thing.`,`I gave it a human action or feeling.`,`It does not use like or as.`]),
M(`“The storm raged.” What effect does it have?`,[`Makes the storm seem angry and powerful`,`Makes it seem calm`,`Says what time it was`,`Makes it funny`],0,`Raging is human anger.`)],
e:[M(`Which sentence uses personification?`,[`The stars twinkled.`,`The stars were bright.`,`The stars winked at the sleepy town.`,`The stars are far away.`],2,`Winking is human.`),
M(`“The engine coughed and refused to start.” Which are the human qualities?`,[`coughed and refused`,`engine`,`start`,`the`],0,`Coughing and refusing are human.`),
M(`Which is NOT personification?`,[`The sunflower bowed its head.`,`The thunder grumbled.`,`The thunder was loud and sudden.`,`The wind sighed.`],2,`It only describes.`)],
rc:`Personification gives human actions or feelings to non-human things.`,ck:[`I can spot the thing and the human quality.`,`I can explain the effect.`,`I can write my own.`]},

{id:'b4',ic:'🧪',t:'Figurative language detective challenge',
pg:`<b>The Old Bridge</b><br>The wind whispered secrets as Dev crept through the sleepy village. His bag weighed a ton. He felt as nervous as a mouse in a room full of cats. The old bridge groaned beneath his boots. Dev crossed it slowly, and the village clock struck eight.`,
hook:`This passage has similes, hyperbole, personification and even plain sentences hiding among them. Can you tell them apart?`,
st:[`Do not classify by a single word. Examine <b>how</b> the expression works.`,`Simile: compares different things with like/as. Hyperbole: exaggeration. Personification: human qualities on non-human things. Literal: just says what happened.`,`Explain the meaning and the <b>effect on the reader</b>.`,`“Dev felt <i>like</i> leaving” has “like” but no comparison, so it is not a simile.`],
vis:V([['Identify','Which type?','#3b5bdb'],['Name it','Simile, hyperbole…','#2f9e44'],['Meaning','What does it say?','#f08c00'],['Effect','What does the reader feel?','#d6336c']]),
ex:[[`“The wind whispered secrets.”`,`Personification: wind given a human action.`],[`“His bag weighed a ton.”`,`Hyperbole: exaggeration.`],[`“The village clock struck eight.”`,`Literal: a plain event.`]],
g:M(`“He felt as nervous as a mouse in a room full of cats.” What type is this?`,[`simile`,`hyperbole`,`personification`,`literal`],0,`“As … as” compares two different things.`),
p:[M(`“The wind whispered secrets.” Type?`,[`personification`,`simile`,`literal`,`hyperbole`],0,`Wind whispering is human.`),
M(`“His bag weighed a ton.” Type?`,[`hyperbole`,`simile`,`personification`,`literal`],0,`A bag cannot weigh a ton.`),
M(`“The village clock struck eight.” Type?`,[`literal`,`simile`,`hyperbole`,`personification`],0,`It states a plain event.`),
M(`“Dev felt like going home.” Is this a simile?`,[`No, “like” means “wanted” and there is no comparison`,`Yes, because it has the word like`],0,`Always check how the word works.`),
W(`Explain the effect of “The old bridge groaned”.`,`It makes the bridge sound tired, creaky and a little spooky.`,[`I named personification.`,`I explained what it makes the reader imagine.`])],
e:[M(`Why does the writer say “weighed a ton” rather than “was heavy”?`,[`Exaggeration stresses how heavy it felt`,`Because it is exact`,`To rhyme`,`To confuse`],0,`Hyperbole adds emphasis.`),
M(`Which gives the strongest effect of nervousness?`,[`as nervous as a mouse in a room full of cats`,`Dev was a boy`,`the clock struck eight`,`a village`],0,`The simile paints a picture.`),
F(`The type of language in “The old bridge groaned” is ______.`,['personification'],`The bridge is given a human sound.`,`Human qualities on a thing.`)],
rc:`Name the type, explain the meaning, and describe the effect.`,ck:[`I can name each type.`,`I can explain meaning and effect.`,`I can avoid classifying by one word only.`]},
/* ---------- GRAMMAR ---------- */
{id:'c1',ic:'🧱',t:'Relative pronouns',
hook:`“The girl is my friend.” “The girl won the race.” Can you glue them into one smooth sentence?`,
st:[`A <b>relative pronoun</b> links extra information to a noun: <b>who</b> (people), <b>which</b> (things/animals), <b>that</b> (people or things), <b>whose</b> (belonging to), <b>whom</b> (people, mostly formal).`,`Combined: “The girl <b>who</b> won the race is my friend.” The part “who won the race” is a <b>relative clause</b>.`,`<b>Whose</b> shows possession: “The boy <b>whose</b> bag was lost cried.”`,`The pronoun can sometimes be left out when it is the object: “The book (that) I read was long.” It cannot be left out when it is the subject: “The girl who won…”.`],
vis:V([['Person/thing','The girl','#2f9e44'],['Pronoun','who','#d6336c'],['Extra information','won the race','#3b5bdb']],['+','+']),
ex:[[`The girl who won the race is my friend.`,`who for a person.`],[`The bike, which was red, was fast.`,`which for a thing; extra information sits between commas.`],[`The book I borrowed was long.`,`Tricky: “that” is left out but understood.`]],
g:M(`The man ___ car was stolen called the police.`,[`who`,`whose`,`which`,`whom`],1,`The car belongs to the man, so use whose.`,`Does something belong to someone?`),
p:[M(`The teacher ___ taught us yesterday is kind.`,[`who`,`whose`,`which`,`whom`],0,`A person doing the action: who.`),
M(`The phone, ___ I bought last week, is broken.`,[`who`,`which`,`whose`,`whom`],1,`A thing, with commas for extra information: which.`),
M(`Best way to combine: The boy is my cousin. The boy plays chess.`,[`The boy who plays chess is my cousin.`,`The boy which plays chess is my cousin.`,`The boy whose plays chess is my cousin.`,`The boy is who my cousin plays chess.`],0,`Who for a person.`),
F(`The girl ___ pencil case fell is crying. (one word)`,['whose'],`Whose shows belonging.`,`Does the pencil case belong to her?`),
M(`In which sentence can the pronoun be left out?`,[`The book that I read was long.`,`The girl who won is my friend.`,`The man who lives next door is kind.`,`The dog which barked is mine.`],0,`“I read” has its own subject, so “that” can be omitted. In the others the pronoun is the subject.`)],
e:[M(`The scientist ___ discovered the planet was thrilled.`,[`whose`,`which`,`who`,`whom`],2,`A person: who.`),
M(`Which sentence is correct?`,[`The tree who fell was old.`,`The tree which fell was old.`,`The tree whose fell was old.`,`The tree whom fell was old.`],1,`A tree is a thing.`),
F(`The farmer, ___ cows were sick, called the vet. (one word)`,['whose'],`The cows belong to the farmer.`)],
rc:`who for people, which for things, that for either, whose for belonging.`,ck:[`I can choose the right pronoun.`,`I can join two sentences.`,`I know when it can be left out.`]},

{id:'c2',ic:'🔗',t:'Connectives and linking ideas',
hook:`“I was hungry. I ate.” Bland! Which small words make the ideas work together?`,
st:[`Connectives link ideas and show a relationship.`,`<b>Addition</b>: and, also, furthermore. <b>Contrast</b>: but, however, although, whereas. <b>Reason</b>: because, since. <b>Result</b>: so, therefore, consequently. <b>Time</b>: before, after, meanwhile, eventually. <b>Condition</b>: if, unless. <b>Purpose</b>: so that, in order to.`,`They work differently: <i>but, because, although</i> join clauses inside one sentence. <i>However, therefore, consequently</i> often start a new sentence or follow a semicolon, then take a comma.`,`Pick the connective by the <b>meaning</b> you want.`],
vis:`<table><tr><th>Job</th><th>Examples</th></tr><tr><td>➕ Addition</td><td>and, also, furthermore</td></tr><tr><td>⚡ Contrast</td><td>but, however, although, whereas</td></tr><tr><td>❓ Reason</td><td>because, since</td></tr><tr><td>➡️ Result</td><td>so, therefore, consequently</td></tr><tr><td>⏱️ Time</td><td>before, after, meanwhile, eventually</td></tr><tr><td>🔑 Condition</td><td>if, unless</td></tr><tr><td>🎯 Purpose</td><td>so that, in order to</td></tr></table>`,
ex:[[`It was cold, but we swam. / Although it was cold, we swam.`,`Contrast two ways.`],[`We stayed in because it rained.`,`Reason.`],[`It rained; however, we played.`,`Tricky: “It rained, however, we played” is a comma splice.`]],
g:M(`I took an umbrella ___ it was raining.`,[`because`,`but`,`unless`,`whereas`],0,`Because gives the reason.`),
p:[SRT(`Sort by job.`,['Contrast','Cause/Result','Time'],[[`because`,1],[`therefore`,1],[`consequently`,1],[`meanwhile`,2],[`however`,0],[`after`,2],[`whereas`,0]],`Contrast shows difference; cause/result explains why; time shows when.`),
M(`I wanted to go out, ___ I had homework.`,[`because`,`but`,`so`,`and`],1,`The ideas contrast.`),
M(`She studied hard, ___ she passed the test.`,[`although`,`so`,`unless`,`whereas`],1,`The result.`),
M(`He saved money ___ he could buy a telescope.`,[`so that`,`unless`,`although`,`before`],0,`Purpose.`),
M(`Which is correct?`,[`It was late, however we kept playing.`,`It was late; however, we kept playing.`,`It was late however we kept playing.`,`It was late. However we, kept playing.`],1,`A semicolon before “however” and a comma after it.`)],
e:[M(`___ the bell rang, the children lined up.`,[`After`,`Unless`,`Although`,`Whereas`],0,`Time.`),
M(`You can’t come ___ you finish your work.`,[`because`,`unless`,`and`,`before`],1,`Condition.`),
M(`The match was cancelled. ___, we stayed home.`,[`Consequently`,`Although`,`Unless`,`Before`],0,`Result.`)],
rc:`Choose connectives by meaning; check punctuation.`,ck:[`I can name connective jobs.`,`I can combine sentences.`,`I can punctuate however/therefore.`]},

{id:'c3',ic:'🚂',t:'Main clauses and subordinate clauses',
hook:`Every train needs an engine. Some sentences have an engine and a carriage. Can the carriage move alone?`,
st:[`A <b>clause</b> has a subject and a verb.`,`A <b>main clause</b> is the engine: it makes sense alone. A <b>subordinate clause</b> is the carriage: it depends on the main clause.`,`Subordinate clauses often begin with <i>although, because, when, if, while, who, which</i>.`,`A <b>phrase</b> has no subject and verb together (“after lunch”).`,`If the subordinate clause comes first, use a comma. If it comes second, you usually don’t.`],
vis:`<div class="vrow"><div class="vbox" style="--c:#d6336c"><b>🚃 Subordinate</b><span>Although it was raining</span></div><span class="op">+</span><div class="vbox"><b>🚂 Main clause</b><span>we continued the match</span></div></div>`,
ex:[[`Although it was raining, we continued the match.`,`Subordinate first, then comma.`],[`When the bell rang, the children left.`,`“When the bell rang” cannot stand alone.`],[`We continued the match after lunch.`,`Tricky: “after lunch” is a phrase.`]],
g:M(`Which is the subordinate clause? <i>Because it was late, we went home.</i>`,[`Because it was late`,`we went home`,`went`,`home`],0,`It starts with “because” and cannot stand alone.`),
p:[SRT(`Sort.`,['Main clause','Subordinate clause','Phrase'],[[`Although it was cold`,1],[`The dog barked`,0],[`after lunch`,2],[`because she was tired`,1],[`in the garden`,2]],`Main clauses stand alone; subordinate ones depend; phrases lack subject + verb.`),
M(`Which is a complete main clause?`,[`When the sun set`,`The sun set`,`Because it set`,`After sunset`],1,`It has a subject and verb and makes sense.`),
M(`In “Although he was tired, Ravi kept running”, the main clause is…`,[`Ravi kept running`,`Although he was tired`,`he was tired`,`Ravi`],0,`It can stand alone.`),
M(`Which is correctly punctuated?`,[`Because it was raining we stayed in.`,`Because it was raining, we stayed in.`,`Because it was, raining we stayed in.`,`Because; it was raining we stayed in.`],1,`Comma after an opening subordinate clause.`),
M(`Which sentence has a subordinate clause?`,[`We played.`,`We played because it was sunny.`,`We played outside.`,`Play now.`],1,`“Because it was sunny”.`)],
e:[M(`In “We left early because we were tired”, the subordinating conjunction is…`,[`because`,`left`,`early`,`we`],0,`Because starts the dependent clause.`),
M(`Which is a phrase, not a clause?`,[`when the film ended`,`after the film`,`as the film ended`,`if the film ended`],1,`No subject and verb.`),
M(`Which is correctly punctuated?`,[`When the film ended we left.`,`When the film ended, we left.`,`When the film ended; we left.`,`When, the film ended we left.`],1,`Comma after the opening clause.`)],
rc:`Main clause = engine, subordinate = carriage.`,ck:[`I can find main clauses.`,`I can find subordinate clauses.`,`I can tell a clause from a phrase.`]},

{id:'c4',ic:'🏗️',t:'Simple, compound and complex sentences',
hook:`“The astronaut waved. The crew cheered.” Choppy! Let’s build better sentences.`,
st:[`<b>Simple</b>: one main clause. “The astronaut waved.”`,`<b>Compound</b>: two main clauses joined, e.g. with and, but, or, so, or a semicolon. “The astronaut waved, and the crew cheered.”`,`<b>Complex</b>: one main clause plus a subordinate clause. “The crew cheered when the astronaut returned.”`,`It depends on clauses, not length or the word “and”. “The astronaut waved and smiled” is still simple.`],
vis:V([['Simple','1 main clause','#2f9e44'],['Compound','main + main','#f08c00'],['Complex','main + subordinate','#d6336c']],['·','·']),
ex:[[`The astronaut waved.`,`Simple.`],[`The astronaut waved, and the crew cheered.`,`Compound.`],[`The tall, brave astronaut with the silver helmet waved and smiled.`,`Tricky! Long but only one clause, so simple.`]],
g:M(`The crew cheered when the astronaut returned.`,[`simple`,`compound`,`complex`],2,`“When the astronaut returned” is subordinate.`),
p:[SRT(`Classify.`,['Simple','Compound','Complex'],[[`The astronaut waved.`,0],[`The astronaut waved, and the crew cheered.`,1],[`The crew cheered when the astronaut returned.`,2],[`Although it was late, we kept working.`,2],[`It rained, so we stayed inside.`,1]],`Count clauses and check whether they are equal or dependent.`),
M(`The long, noisy train rushed through the dark tunnel.`,[`simple`,`compound`,`complex`],0,`One clause.`),
M(`Join: Mia sang. Raj danced.`,[`Mia sang, and Raj danced.`,`Mia sang and, Raj danced.`,`Mia sang Raj danced.`,`Mia, sang and Raj danced.`],0,`Comma then and.`),
M(`“Mia sang, Raj danced.” What is wrong?`,[`A comma alone cannot join two main clauses`,`Nothing`,`It needs a colon`,`It needs a bracket`],0,`Add a conjunction or use a semicolon.`),
M(`Best improvement for: I got up. I ate. I went to school.`,[`When I had eaten breakfast, I went to school.`,`I got up I ate I went.`,`I got up. I ate.`,`I school.`],0,`Varies structure and joins ideas.`)],
e:[M(`She read quietly, but he played loudly.`,[`simple`,`compound`,`complex`],1,`Two main clauses.`),
M(`Because the road was icy, the bus was late.`,[`simple`,`compound`,`complex`],2,`Subordinate + main.`),
M(`Which is a simple sentence?`,[`We went home and slept.`,`We went home, and we slept.`,`We went home because we were tired.`,`When we got home, we slept.`],0,`One subject, two verbs, one clause.`)],
rc:`Count clauses and check how they are joined.`,ck:[`I can classify sentences.`,`I can build compound and complex ones.`,`I can fix comma errors.`]},

{id:'e1',ic:'🛒',t:'Quantifiers: countable and uncountable nouns',
hook:`Can you count water? “Two waters?” Hmm. Some things can be counted, some cannot!`,
st:[`<b>Countable</b> nouns can be counted: apples, books. <b>Uncountable</b> nouns cannot: water, rice, information, advice.`,`Countable: <b>many, a few, few, fewer</b>. Uncountable: <b>much, a little, little, less</b>. Both: <b>some, any, a lot of</b>.`,`<b>Few</b> = not many (often not enough). <b>A few</b> = some. <b>Little</b> = not much. <b>A little</b> = some.`,`Formally: <b>fewer</b> books, <b>less</b> water. Everyday English sometimes uses “less” with counted things, but use the formal rule in exams.`,`<b>some</b> in positive sentences, <b>any</b> in questions and negatives. “Would you like some tea?” is an offer.`],
vis:`<div class="vrow"><div class="vbox" style="--c:#2f9e44"><b>🧺 COUNTABLE</b><span>🍎🍎🍎 apples, books, pencils, chairs → many, few, fewer</span></div><div class="vbox" style="--c:#3b5bdb"><b>🪣 UNCOUNTABLE</b><span>💧🍚 water, rice, information, advice → much, little, less</span></div></div>`,
ex:[[`There are many books. How much water is there?`,`Many with countable, much with uncountable.`],[`I have a few friends. / I have few friends.`,`First is positive; second suggests not enough.`],[`Is there any milk? There isn’t any milk.`,`Any in questions and negatives.`]],
g:M(`There isn’t ___ milk.`,[`any`,`many`,`few`,`a few`],0,`Negative + uncountable: any.`),
p:[SRT(`Sort the nouns.`,['Countable','Uncountable'],[[`apples`,0],[`rice`,1],[`information`,1],[`chairs`,0],[`advice`,1],[`pencils`,0]],`You can count apples, chairs and pencils but not rice, information or advice.`),
M(`How ___ water do you drink?`,[`much`,`many`,`few`,`fewer`],0,`Water is uncountable.`),
M(`There are ___ eggs in the fridge, so we can make an omelette.`,[`a few`,`a little`,`much`,`less`],0,`Eggs are countable and “some” is enough.`),
M(`She drinks ___ water than her brother.`,[`fewer`,`less`],1,`Water is uncountable.`),
M(`Fix: “I don’t have some money.”`,[`I don’t have any money.`,`I don’t have many money.`,`I have don’t some money.`,`No change`],0,`Negative: any.`)],
e:[M(`Is there ___ milk in the jug?`,[`any`,`many`,`few`,`fewer`],0,`Question + uncountable.`),
M(`“I have little time.” This suggests…`,[`I probably don’t have enough time`,`I have plenty of time`,`I have time for a few things`,`I have two times`],0,`Little means not much.`),
M(`Which is correct?`,[`How many information do you need?`,`How much information do you need?`,`How few information do you need?`,`How fewer information do you need?`],1,`Information is uncountable.`)],
rc:`Many/few/fewer with countable; much/little/less with uncountable; some, any, a lot of with both.`,ck:[`I can sort nouns.`,`I know few vs a few.`,`I know some vs any.`]},

{id:'d1',ic:'✏️',t:'Commas (including parenthetic commas)',
hook:`“Let’s eat Grandma.” Oh no! “Let’s eat, Grandma.” One comma changes everything.`,
st:[`Commas separate <b>items in a list</b>: “apples, bananas and grapes.” (A comma before “and” is optional; follow your school.)`,`Put a comma after an <b>introductory word or phrase</b>: “After lunch, we played.”`,`Use a comma before and/but/so when joining <b>two main clauses</b>: “It was late, but we kept playing.”`,`<b>Parenthetic commas</b> come in pairs around extra information: “My brother, who loves astronomy, built a telescope.” If you can remove it and the sentence still makes sense, it is extra information.`,`If the information is essential to identify someone, no commas: “The girl who won the race is my friend.”`],
vis:V([['My brother','','#3b5bdb'],[', who loves astronomy,','extra information','#d6336c'],['built a telescope.','','#2f9e44']],['','']),
ex:[[`We bought apples, bananas and grapes.`,`List.`],[`After lunch, we played cricket.`,`Introductory phrase.`],[`The girl who won the race is my friend.`,`Tricky: no commas, the clause tells us which girl.`]],
g:M(`Which sentence is correct?`,[`My cousin who lives in Pune visits.`,`My cousin, who lives in Pune, visits.`,`My cousin, who lives in Pune visits.`,`My, cousin who lives in Pune, visits.`],1,`Extra information needs a pair of commas.`),
p:[M(`Which list is correct?`,[`We need eggs flour, and milk.`,`We need eggs, flour and milk.`,`We need, eggs flour and milk.`,`We need eggs flour and, milk.`],1,`Commas separate list items.`),
M(`Where does the comma go? <i>After the storm ended the children ran outside.</i>`,[`after “storm”`,`after “ended”`,`after “children”`,`after “ran”`],1,`After the introductory clause.`),
M(`Add commas: Our teacher Mrs Iyer who is very kind helped us.`,[`Our teacher, Mrs Iyer, who is very kind, helped us.`,`Our teacher Mrs Iyer, who is very kind helped us.`,`Our teacher, Mrs Iyer who is very kind, helped us.`,`Our teacher Mrs, Iyer who is, very kind helped us.`],0,`Pairs around each piece of extra information.`),
M(`“The girl who won the race is my friend.” Does the “who” clause need commas?`,[`No, it is essential to identify the girl`,`Yes always`],0,`Without it, we don’t know which girl.`),
M(`Which is correct?`,[`It was late but we kept playing.`,`It was late, but we kept playing.`,`It was, late but we kept playing.`,`It was late but, we kept playing.`],1,`Comma before but joining two main clauses.`)],
e:[M(`Which is correct?`,[`My dog, Bruno barks loudly.`,`My dog, Bruno, barks loudly.`,`My dog Bruno, barks loudly.`,`My dog, Bruno barks, loudly.`],1,`A pair around the name.`),
M(`Which uses commas correctly in a list?`,[`I packed socks, shoes, a hat and a scarf.`,`I packed, socks shoes a hat and a scarf.`,`I packed socks shoes, a hat, and a, scarf.`,`I, packed socks, shoes a hat and a scarf.`],0,`Commas between items.`),
M(`Why does “My sister, who plays violin, is late” have two commas?`,[`The “who” clause is extra information`,`Every sentence needs two commas`,`The word sister is special`,`To make it longer`],0,`It could be removed.`)],
rc:`Lists, introductory phrases, joining main clauses, and pairs around extra information.`,ck:[`I can use commas in lists.`,`I can use parenthetic commas in pairs.`,`I know when not to use commas.`]},

{id:'d2',ic:'⚙️',t:'Colons and semicolons',
hook:`One dot above a comma, or two dots? These marks have special jobs.`,
st:[`A <b>colon</b> introduces a list, explanation or example after a complete clause. “Bring three things: a pencil, an eraser and a ruler.”`,`Don’t put a colon straight after a verb like “is/are”: “My pets are: a cat” is not standard.`,`A <b>semicolon</b> joins two closely related main clauses. Both sides must be complete sentences. “The rain stopped; the children returned outside.”`,`A semicolon is not a comma. It can also separate complicated list items that contain commas.`],
vis:V([['Colon','complete clause : list or explanation','#3b5bdb'],['Semicolon','complete clause ; complete clause','#d6336c']],['vs']),
ex:[[`He had one fear: heights.`,`Colon introduces an explanation.`],[`The rain stopped; the children returned outside.`,`Both sides can stand alone.`],[`I like apples; because they’re sweet.`,`Tricky! Wrong. “Because they’re sweet” is not a main clause.`]],
g:M(`Which is correct?`,[`We need: milk and eggs.`,`We need two things: milk and eggs.`,`We: need milk and eggs.`,`We need two: things milk and eggs.`],1,`A full clause comes before the colon.`),
p:[M(`Which uses a semicolon correctly?`,[`The rain stopped; the children returned outside.`,`The rain stopped; and the children returned.`,`Because the rain stopped; the children returned.`,`The rain; stopped the children returned.`],0,`Both sides are complete.`),
SRT(`Can a semicolon go in the gap?`,['Yes','No'],[[`The sun set ___ the sky turned orange.`,0],[`Although it was late ___ we kept going.`,1],[`My favourite fruit ___ mangoes.`,1],[`I was tired ___ I went to bed early.`,0]],`Check both sides can stand alone.`),
M(`Which list uses semicolons correctly?`,[`We visited Kochi, India; Galle, Sri Lanka; and Male, Maldives.`,`We visited Kochi; India, Galle; Sri Lanka and Male; Maldives.`,`We visited; Kochi India Galle.`,`We visited Kochi, India, Galle, Sri Lanka and Male.`],0,`Semicolons separate items that contain commas.`),
M(`What does the colon do in “He had one fear: heights”?`,[`Introduces the explanation`,`Joins two sentences`,`Shows a pause`,`Closes the sentence`],0,`It introduces what the fear was.`),
M(`Which sentence needs a colon?`,[`I bought three things a pen a book and a ruler.`,`I bought a pen.`,`I bought it.`,`I did.`],0,`A list follows a complete clause.`)],
e:[M(`Which is correct?`,[`The bell rang; the class went quiet.`,`The bell rang; because the class went quiet.`,`The bell; rang the class went quiet.`,`The bell rang the; class went quiet.`],0,`Two complete clauses.`),
M(`Which uses a colon correctly?`,[`My three pets are: a cat, a dog and a fish.`,`I have three pets: a cat, a dog and a fish.`,`I: have three pets a cat.`,`I have: three pets a cat a dog.`],1,`A complete clause comes first.`),
M(`Why is “It was late, we went home.” wrong?`,[`A comma alone cannot join two main clauses`,`It is too long`,`Home needs a capital`,`Nothing is wrong`],0,`Use a semicolon, full stop or conjunction.`)],
rc:`Colon after a complete clause; semicolon between two related main clauses.`,ck:[`I can use a colon for lists and explanations.`,`I can check both sides of a semicolon.`,`I know a semicolon is not a comma.`]},

{id:'d3',ic:'💥',t:'Dashes, brackets and ellipses',
hook:`I opened the box—and out jumped a tiny robot! Which punctuation makes a surprise, adds a side note, or leaves a mystery?`,
st:[`A <b>dash</b> (—) adds emphasis, shows interruption or introduces extra information: “I opened the box—and out jumped a tiny robot!”`,`<b>Brackets</b> ( ) enclose extra explanation. Remove it and the sentence still works: “The Great Fire of London (which began in 1666) changed the city.”`,`An <b>ellipsis</b> (…) is three dots showing an unfinished thought, a pause, or omitted words in a quotation: “I thought I heard something…”`,`Use them purposefully, not everywhere. Follow your school’s style for dash length.`],
vis:V([['Dash —','surprise, interruption','#d6336c'],['Brackets ( )','extra explanation','#3b5bdb'],['Ellipsis …','pause, unfinished','#2f9e44']],['·','·']),
ex:[[`I opened the box—and out jumped a tiny robot!`,`Dash for surprise.`],[`The Great Fire of London (which began in 1666) changed the city.`,`Brackets for extra information.`],[`Perhaps we should…`,`Ellipsis for an unfinished thought. Too many ellipses lose the effect.`]],
g:M(`Which sentence uses brackets correctly?`,[`The robot (built in the lab) rolled away.`,`The (robot built in the lab rolled) away.`,`The robot built (in the lab rolled) away.`,`(The robot) built in the lab rolled away.`],0,`The bracketed words add extra information.`),
p:[M(`Which uses brackets properly?`,[`Mount Everest (the highest mountain on Earth) is in Asia.`,`Mount (Everest the highest mountain on Earth is) in Asia.`,`Mount Everest the (highest mountain on) Earth is in Asia.`,`(Mount Everest is in) Asia.`],0,`The explanation can be removed.`),
M(`Which uses a dash for interruption?`,[`I was about to leave—wait, what was that noise?`,`I—was about to leave what was that noise.`,`I was about to leave what was—that noise.`,`I was—about to leave wait what was that noise.`],0,`The dash shows a sudden change.`),
M(`“Perhaps we should…” What does the ellipsis show?`,[`An unfinished thought`,`A list is coming`,`A question`,`A shout`],0,`The speaker trails off.`),
SRT(`Which mark?`,['Dash','Brackets','Ellipsis'],[[`A sudden reveal or interruption`,0],[`Extra explanation that could be removed`,1],[`A thought that trails off`,2],[`Emphasis on a surprise ending`,0],[`A pause full of suspense`,2]],`Match each job to the mark.`),
M(`Why shouldn’t we use ellipses everywhere?`,[`They lose their effect`,`They are rude`,`They are banned`,`They are short`],0,`Used rarely, they build suspense.`)],
e:[M(`Which uses brackets correctly?`,[`The robot (built in the lab) rolled away.`,`The robot (built in the lab rolled) away.`,`The (robot) built in the lab rolled away.`,`The robot built (in the lab rolled) away.`],0,`The bracketed words are extra.`),
M(`Which uses a dash well?`,[`He opened the box—and gasped.`,`He—opened the box and gasped.`,`He opened—the box and gasped.`,`—He opened the box and gasped.`],0,`The dash marks a dramatic pause.`),
M(`An ellipsis can show words omitted from a quotation.`,[`True`,`False`],0,`Yes, it shows left-out words.`)],
rc:`Dash = surprise/interruption. Brackets = extra info. Ellipsis = unfinished or omitted.`,ck:[`I can use a dash.`,`I can use brackets.`,`I can use an ellipsis purposefully.`]},

{id:'d4',ic:'🛠️',t:'Mixed punctuation repair challenge',
hook:`Everything is broken! Missing capitals, tangled commas, strange colons. Time to repair a whole paragraph.`,
st:[`Editing checklist: capital letters and full stops; commas in lists and after introductions; pairs of commas around extra information; colon after a complete clause; semicolon between related main clauses; dashes, brackets and ellipses used purposefully.`,`Read your sentence aloud. Pauses often show punctuation.`,`Compare two versions: punctuation can change meaning (“Let’s eat, Grandma” vs “Let’s eat Grandma”).`],
vis:V([['Read','aloud','#3b5bdb'],['Check','capitals, stops','#2f9e44'],['Fix','commas, colons…','#f08c00'],['Re-read','does it work?','#d6336c']]),
ex:[[`after school we bought pens pencils and a ruler`,`Fixed: After school, we bought pens, pencils and a ruler.`],[`The match was cancelled; the pitch was flooded.`,`Semicolon joins related clauses.`],[`I think… no, I know—we’re late!`,`Tricky: ellipsis = hesitation, dash = sudden realisation.`]],
g:M(`Which is the best repair? <i>after school we bought pens pencils and a ruler</i>`,[`After school, we bought pens, pencils and a ruler.`,`After school we bought: pens pencils and a ruler.`,`After school we bought pens, pencils, and, a ruler.`,`after school. we bought pens.`],0,`Capital, comma after introduction, commas in list.`),
p:[M(`Which mark correctly joins these two related main clauses without a conjunction? <i>The match was cancelled __ the pitch was flooded.</i>`,[`;`,`,`,`(`,`!`],0,`A semicolon joins two related main clauses. A comma alone would be a comma splice.`),
M(`“Let’s eat Grandma” vs “Let’s eat, Grandma.” The comma shows…`,[`we are speaking to Grandma`,`we will eat her`,`nothing`,`a list`],0,`It marks direct address.`),
M(`Which mark shows a sudden interruption?`,[`dash`,`colon`,`comma`,`full stop`],0,`A dash.`),
M(`Which is correct?`,[`My brother, who loves chess, runs a club.`,`My brother who loves chess, runs a club.`,`My brother, who loves chess runs a club.`,`My, brother who loves chess runs a club.`],0,`Pair of commas.`),
W(`Correct this paragraph: <i>last night the lights went out we found torches candles and matches it was spooky</i>`,`Last night the lights went out; we found torches, candles and matches. It was spooky.`,[`Capital letter at the start.`,`Semicolon or full stop between the two ideas.`,`Commas in the list.`,`Full stops at the end.`])],
e:[M(`Which is correct?`,[`When it stopped raining, we went out; and played.`,`When it stopped raining, we went out and played.`,`When it stopped raining we went, out and played.`,`When; it stopped raining we went out.`],1,`No semicolon needed.`),
M(`Choose the best repair: <i>My teacher Mr Kapoor who loves chess runs a club.</i>`,[`My teacher, Mr Kapoor, who loves chess, runs a club.`,`My teacher Mr Kapoor, who loves chess runs a club.`,`My teacher, Mr Kapoor who loves chess, runs a club.`,`My teacher Mr, Kapoor who loves chess runs a club.`],0,`Commas in pairs.`),
M(`Which is correct?`,[`I have three hobbies; reading, drawing and chess.`,`I have three hobbies: reading, drawing and chess.`,`I have, three hobbies reading, drawing and chess.`,`I have three: hobbies reading drawing and chess.`],1,`Colon after a complete clause.`)],
rc:`Check capitals, commas, colons, semicolons, dashes, brackets, ellipses.`,ck:[`I use an editing checklist.`,`I can repair a paragraph.`,`I can explain why each mark is needed.`]},
/* ---------- SPELLING ---------- */
{id:'f1',ic:'🔬',t:'Prefixes and suffixes',
hook:`Happy… unhappy… happiness. One base word, many new words. How do the changes work?`,
st:[`A <b>prefix</b> goes at the beginning: un-, dis-, im-, in-, re-, mis-. Un-, dis-, im-, in- often mean “not”; re- means “again”; mis- means “wrongly”.`,`A <b>suffix</b> goes at the end: -ful (full of), -less (without), -er (person who), -ness (state of), -ly.`,`Spelling changes: change y to i (happy → happiness); drop silent e before a vowel suffix (bake → baker) but keep it before a consonant suffix (care → careful).`,`Not every prefix or suffix fits every word. “unpossible” is not a word; it is <i>impossible</i>.`],
vis:V([['un-','not','#d6336c'],['happy','base word','#3b5bdb'],['-ness','state of','#2f9e44']],['+','+']),
ex:[[`happy → unhappy; agree → disagree`,`Prefixes change meaning.`],[`care → careful / careless`,`Suffixes change meaning or word type.`],[`happy + ness = happiness; possible → impossible`,`Tricky: y changes to i; im- before p.`]],
g:M(`What is the base word of <b>carelessness</b>?`,[`care`,`less`,`ness`,`careless`],0,`Remove the suffixes -less and -ness.`),
p:[M(`The prefix <b>dis-</b> usually means…`,[`not or opposite`,`again`,`full of`,`person who`],0,`Dis- reverses meaning.`),
M(`Which is spelled correctly?`,[`happyness`,`happiness`,`hapiness`,`happines`],1,`Change y to i, then add ness.`),
F(`Add -ful to “help”. ______`,['helpful'],`Help + ful.`,`No change in spelling.`),
M(`Which is NOT a real word?`,[`unhappy`,`disagree`,`unpossible`,`impossible`],2,`The word is impossible.`),
M(`What does <b>re-</b> mean in <i>rewrite</i>?`,[`write again`,`not write`,`write badly`,`writer`],0,`Re- means again.`)],
e:[F(`Add -er to “teach” (a person who teaches). ______`,['teacher'],`Teach + er.`),
F(`Add -er to “bake” (a person who bakes). ______`,['baker'],`Drop the e before a vowel suffix.`),
M(`Which is spelled correctly?`,[`kindnes`,`kindness`,`kindnass`,`kindnness`],1,`Kind + ness.`)],
rc:`Prefix at the start, suffix at the end. Watch spelling changes.`,ck:[`I can find base words.`,`I know common meanings.`,`I know y→i and drop-e.`]},

{id:'f2',ic:'🔊',t:'Suffixes with similar sounds',
hook:`Action, musician, decision, discussion, importance, difference. Many sound like “shun” or “unce”. How do you choose?`,
st:[`<b>-tion</b> is the most common “shun” (action, invention).`,`<b>-cian</b> is for people with a skill: musician (music), electrician (electric), magician.`,`<b>-sion</b> often follows from verbs like decide → decision, confuse → confusion.`,`<b>-ssion</b>: discuss → discussion, permit → permission.`,`<b>-ance</b> vs <b>-ence</b>: important → importance; different → difference; confident → confidence (words ending -ant often take -ance and words ending -ent often take -ence). Some, like appear → appearance, must simply be learned. These are patterns, not absolute rules: learn word families and check a dictionary.`],
vis:`<div class="vrow"><div class="vbox"><b>-tion</b><span>action, invention</span></div><div class="vbox" style="--c:#d6336c"><b>-cian</b><span>musician, electrician</span></div><div class="vbox" style="--c:#2f9e44"><b>-sion / -ssion</b><span>decision, discussion</span></div><div class="vbox" style="--c:#f08c00"><b>-ance / -ence</b><span>importance, difference</span></div></div>`,
ex:[[`music → musician`,`Skilled person.`],[`discuss → discussion, permit → permission`,`Double s in -ssion words.`],[`important → importance but different → difference`,`Tricky: -ant usually gives -ance, -ent usually gives -ence. Check the word family.`]],
g:M(`A person who fixes electrical things is an…`,[`electrician`,`electrition`,`electrission`,`electrisian`],0,`Electric + ian makes -cian.`),
p:[SRT(`Sort the words by ending.`,['-tion','-cian','-sion / -ssion'],[[`action`,0],[`musician`,1],[`decision`,2],[`discussion`,2],[`electrician`,1],[`invention`,0],[`permission`,2]],`-cian is a person; -tion is the common “shun”; -sion/-ssion are from words like decide, discuss.`),
M(`Her ___ to join the club surprised us.`,[`decission`,`decision`,`decizion`,`decishun`],1,`Decide → decision.`),
F(`Listen and spell the word.`,['importance'],`Important → importance.`,`The word means “being important”.`,['importance']),
M(`different → ?`,[`difference`,`differance`,`differense`,`differents`],0,`-ent → -ence.`),
F(`Listen and spell the word.`,['action'],`Act → action.`,`What you do.`,['action'])],
e:[M(`Which is spelled correctly?`,[`confusion`,`confution`,`confusian`,`confussion`],0,`Confuse → confusion.`),
M(`Which ending shows a person with a skill?`,[`-tion`,`-cian`,`-sion`,`-ance`],1,`-cian.`),
F(`Listen and spell the word.`,['appearance'],`Appear → appearance.`,`Noun from “appear”.`,['appearance'])],
rc:`Use word families and patterns; check unsure words.`,ck:[`I can spell -tion, -cian, -sion, -ssion.`,`I can choose -ance or -ence.`,`I use word families.`]},

{id:'f3',ic:'🧩',t:'Homophones and commonly confused words',
hook:`There, their and they’re sound the same but have different jobs. Use the meaning, not the sound.`,
st:[`<b>there</b> (place), <b>their</b> (belonging), <b>they’re</b> (they are). <b>your</b> (belonging), <b>you’re</b> (you are). <b>to/too/two</b>: direction, also, number.`,`<b>hear</b> (ears), <b>here</b> (place). <b>right</b> (correct), <b>write</b> (with a pen). <b>knew</b> (past of know), <b>new</b>. <b>its</b> (belonging), <b>it’s</b> (it is/it has). <b>were</b> / <b>where</b> (place).`,`<b>accept</b> (take), <b>except</b> (not including). <b>lose</b> (misplace), <b>loose</b> (not tight). <b>affect</b> (verb: change), <b>effect</b> (noun: result).`,`Test: say the sentence with the full words (they are, you are, it is). If it works, use the apostrophe.`],
vis:`<div class="grid"><div class="tile"><b>there / their / they’re</b><br>place / belongs / they are</div><div class="tile"><b>its / it’s</b><br>belongs / it is</div><div class="tile"><b>hear / here</b><br>hear has ear</div><div class="tile"><b>lose / loose</b><br>loose has extra o</div><div class="tile"><b>affect / effect</b><br>verb / noun</div></div>`,
ex:[[`Their bags are there, and they’re late.`,`Three words, three jobs.`],[`The dog wagged its tail. It’s happy.`,`its belongs; it’s means it is.`],[`The rain will affect our plans; the effect is a delay.`,`Tricky: affect is the verb, effect is the noun.`]],
g:M(`___ going to be late.`,[`They’re`,`Their`,`There`],0,`“They are going”.`),
p:[M(`Put your books over ___.`,[`there`,`their`,`they’re`],0,`Place.`),
M(`I can ___ the birds singing.`,[`hear`,`here`],0,`Hear has ear.`),
M(`The cat licked ___ paws.`,[`its`,`it’s`],0,`Belongs to the cat.`),
F(`I will ___ a letter to my friend. (right or write?)`,['write'],`Write is with a pen.`,`Which one uses words?`),
M(`I don’t want to ___ my keys.`,[`lose`,`loose`],0,`Lose = misplace.`)],
e:[M(`The weather will ___ our plans.`,[`affect`,`effect`],0,`Verb.`),
M(`The tooth was ___ so it fell out.`,[`lose`,`loose`],1,`Not tight.`),
M(`Everyone ___ Tom came.`,[`accept`,`except`],1,`Not including.`)],
rc:`Choose homophones by meaning.`,ck:[`I can use there/their/they’re.`,`I can use its/it’s.`,`I use meaning to choose.`]},
/* ---------- STORYTELLING ---------- */
{id:'g1',ic:'⛰️',t:'Story features and the story mountain',
hook:`Every great story climbs a mountain: it starts calmly, climbs through trouble, reaches a peak, then settles. Where will yours begin?`,
st:[`<b>Story mountain</b>: 1 characters and setting → 2 opening → 3 problem → 4 rising events → 5 climax → 6 resolution → 7 ending/reflection.`,`<b>Viewpoint</b>: first person (“I”) or third person (“she/he/they”). Stay consistent.`,`<b>Show, don’t tell</b>: “His knees shook” instead of “He was scared”. Use thoughts, feelings, actions, dialogue and the five senses.`,`<b>Techniques</b>: figurative language, varied sentences, paragraphs, accurate punctuation, and a believable resolution that solves the problem.`],
vis:V([['Opening','characters + setting','#2f9e44'],['Rising','problem grows','#f08c00'],['Climax','turning point','#d6336c'],['Ending','solved + reflect','#3b5bdb']]),
ex:[[`Show vs tell: “Ravi was scared” → “Ravi’s knees shook and his voice cracked.”`,`Showing is more vivid.`],[`I opened the door → She opened the door`,`First vs third person.`],[`“Then she woke up. It was all a dream.”`,`Tricky: usually a weak ending because the problem isn’t solved.`]],
g:M(`Which sentence shows rather than tells?`,[`Ravi was scared.`,`Ravi’s knees shook and his voice cracked.`,`Ravi felt fear.`,`Ravi was a boy.`],1,`It shows the fear through actions.`),
p:[SRT(`Where in the story?`,['Beginning','Middle','End'],[[`Introduce characters and setting`,0],[`The problem gets bigger`,1],[`The climax`,1],[`The problem is solved`,2],[`The character reflects`,2]],`Beginning sets up, middle builds, end resolves.`),
M(`“I opened the door and my heart raced.” Viewpoint?`,[`first person`,`third person`],0,`I = first person.`),
M(`Which signals a flashback?`,[`Suddenly, she remembered the summer when…`,`The end.`,`Next Tuesday…`,`Tomorrow…`],0,`Remembering shifts to an earlier event.`),
M(`Which uses smell?`,[`The air smelled of salt and smoke.`,`The room was big.`,`He ran fast.`,`It was loud.`],0,`Smell.`),
M(`A key was lost. Which ending is the most satisfying?`,[`Mina remembered she had left it in her coat pocket and found it.`,`Then she woke up. It was a dream.`,`Suddenly, a stranger gave her a new key and left.`,`The end.`],0,`It uses an earlier clue and solves the problem logically.`)],
e:[M(`“She looked at him and smiled.” Viewpoint?`,[`first person`,`third person`],1,`She/him: third person.`),
M(`A flashback takes the reader to…`,[`an earlier event`,`the future`,`the end`,`a new story`],0,`It reveals background.`),
M(`Which resolution is most believable for a lost key problem?`,[`She retraced her steps and found it by the gate.`,`A fairy appeared.`,`It was a dream.`,`The key flew home.`],0,`Logical.`)],
rc:`Story mountain, viewpoint, show don’t tell, flashback, logical resolution.`,ck:[`I can plan with a story mountain.`,`I can show not tell.`,`I can keep my viewpoint steady.`]},

{id:'g2',ic:'🔭',t:'Viewpoint and flashback workshop',
hook:`A lost robot in a school lab. A student says, “I found it beeping.” The robot says, “I was calling for help.” Same event, different story!`,

vis:V([['Present','Maya at the cliff edge','#3b5bdb'],['Memory','Years earlier, she fell','#d6336c'],['Back','She steps forward','#2f9e44']]),
ex:[[`Student: “I found the robot beeping and thought it was broken.”`,`The student misunderstands.`],[`Robot: “I was not broken. I was calling for help in the only language I knew.”`,`The robot knows what the student doesn’t.`],[`Suddenly, Nila remembered the day her grandfather had given her the map.`,`Flashback signal + past perfect.`]],
g:M(`Which sentence signals the return to the present?`,[`Back in the lab, Maya lifted the robot.`,`Years earlier, Maya was small.`,`She remembered a summer.`,`Long ago…`],0,`It returns to the present.`),
p:[M(`Robot narrator: “I did not know why the student was shouting.” This shows…`,[`the narrator misunderstanding humans`,`the narrator knowing everything`,`a flashback`,`a simile`],0,`The narrator’s knowledge is limited.`),
M(`Which keeps first-person viewpoint?`,[`I opened the lid, and I felt my heart race.`,`I opened the lid, and Meera felt her heart race.`,`He opened the lid.`,`We opened.`],0,`Stay with I.`),
M(`She remembered the day her grandfather ___ her the map.`,[`had given`,`gives`,`will give`,`giving`],0,`Past perfect for an earlier event.`),
M(`Which is the best signal for a flashback?`,[`Suddenly, Nila remembered…`,`Then, the end.`,`Meanwhile tomorrow…`,`And…`],0,`It tells readers we are going back.`),

{t:'The Flood Marker (historical fiction, annotated model)',h:`<p><mark class="m1" title="Setting">Dawn spread like spilled gold over the Nile as Meret hurried towards the riverbank, her father’s measuring rope in her hand.</mark> <mark class="m2" title="Character">Meret, ten years old and sharp-eyed, was the only child in her village who could read the scribe’s marks.</mark> <mark class="m3" title="Problem">The flood was late, and the fields of her village were cracking like old pottery.</mark></p><p><mark class="m4" title="Flashback">She remembered her grandmother’s story: long ago, a patient priest had noticed that a bright star rose at dawn just before the waters came.</mark> <mark class="m5" title="Connectives">Because the elders were arguing, Meret climbed to the roof and waited.</mark></p><p>At last the star Sopdet blazed at the horizon. “The flood is coming!” she cried. Her neighbours moved their grain just before the river rose. <mark class="m6" title="Resolution">By evening, dark water spread across the fields, and the village was safe.</mark></p><p class="note"><b>Why it works:</b> <mark class="m1">setting</mark> uses a simile and place details; <mark class="m2">character</mark> shows a skill; <mark class="m3">problem</mark> is clear and fits the time; <mark class="m4">flashback</mark> supplies the clue that solves it; <mark class="m5">connective</mark> shows cause; <mark class="m6">resolution</mark> follows from the clue. The star detail is based on the ancient Egyptians’ link between Sirius and the flood. Always check with your textbook.</p>`},

function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||typeof S!=='object')S={};['ans','done','teach','papers','checks','plan','tr'].forEach(k=>S[k]=S[k]||{});['vocab','stories','wrong'].forEach(k=>S[k]=S[k]||[]);S.draft=S.draft||'';S.stars=S.stars||0}

 if(!ok){S.wrong.push({l:lid,qid,q:strip(q.q).slice(0,220),given:String(given).slice(0,160),ans:strip(ansText(q)).slice(0,200),why:strip(q.why||'')});if(S.wrong.length>200)S.wrong.shift()}save();stars()}

 const qb=d.querySelector('.qb'),fb=d.querySelector('.fb'),qa=d.querySelector('.qa');let tries=0,solved=false;
 qa.append(btn('💡 Hint',()=>{fb.className='fb hint';fb.textContent=q.hint||'Read the question again slowly and look for a clue word.'},'alt'));

 else if(q.t==='fill'){if(q.say){qb.append(btn('🔊 Hear the word',()=>{if(!speak(q.say[0]))alert('Sound is not available here. Hint: '+(q.hint||''))},'sun'))}
  const i=document.createElement('input');i.className='fi';i.setAttribute('aria-label','Your answer');i.autocomplete='off';i.autocapitalize='off';i.spellcheck=false;qb.append(i);

 add(/\b(as \w+ as|like an? )/.test(lc),`I spotted a possible simile.`,`Try a simile with like or as.`);
