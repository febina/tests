<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INACC Space Science Quiz</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161f30;
      --card-hover: #1e293b;
      --primary: #6366f1;
      --primary-glow: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s ease;
    }

    .chapter-tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .option-btn .opt-prefix {
      font-weight: 700;
      color: var(--accent);
      margin-right: 12px;
      width: 24px;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.2) !important;
      border-color: var(--correct) !important;
      color: #86efac;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--wrong) !important;
      color: #fca5a5;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: var(--primary-glow);
    }

    .nav-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .results-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 4px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .rating-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.95rem;
    }

    .score-table th, .score-table td {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    .score-table th {
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

    let currentIdx = 0;
    const userAnswers = {};

    function renderQuestion() {
      const q = questions[currentIdx];
      document.getElementById('chapterTag').innerText = q.ch;
      document.getElementById('questionCount').innerText = `Question ${currentIdx + 1} / ${questions.length}`;
      document.getElementById('questionText').innerText = `${q.id}. ${q.q}`;
      document.getElementById('progressBar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];
      const hasAnswered = userAnswers[currentIdx] !== undefined;

      q.opts.forEach((opt, idx) => {
        const letter = letters[idx];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-prefix">${letter}.</span> ${opt}`;

        if (hasAnswered) {
          btn.disabled = true;
          if (letter === q.a) {
            btn.classList.add('correct');
          }
          if (userAnswers[currentIdx] === letter && letter !== q.a) {
            btn.classList.add('wrong');
          }
        } else {
          btn.onclick = () => selectAnswer(letter);
        }

        optionsList.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentIdx === 0;
      document.getElementById('nextBtn').innerText = currentIdx === questions.length - 1 ? 'Finish' : 'Next';
    }

    function selectAnswer(letter) {
      userAnswers[currentIdx] = letter;
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function showResults() {
      document.getElementById('quizScreen').style.display = 'none';
      const resultsScreen = document.getElementById('resultsScreen');
      resultsScreen.style.display = 'block';

      let score = 0;
      questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.a) score++;
      });

      document.getElementById('finalScore').innerText = `${score}/80`;

      const badge = document.getElementById('ratingBadge');
      const feedback = document.getElementById('feedbackText');

      if (score >= 72) {
        badge.innerText = "🌟 Excellent!";
        badge.style.background = "rgba(34, 197, 94, 0.2)";
        badge.style.color = "#86efac";
        feedback.innerText = "Outstanding job! You have mastered the Space Science fundamentals.";
      } else if (score >= 64) {
        badge.innerText = "🚀 Very Strong!";
        badge.style.background = "rgba(56, 189, 248, 0.2)";
        badge.style.color = "#38bdf8";
        feedback.innerText = "Great score! A quick review of the missed questions will get you to top marks.";
      } else if (score >= 56) {
        badge.innerText = "👍 Good!";
        badge.style.background = "rgba(234, 179, 8, 0.2)";
        badge.style.color = "#fde047";
        feedback.innerText = "Good effort! Revise key mission details and planetary facts to improve.";
      } else if (score >= 40) {
        badge.innerText = "📖 Revise";
        badge.style.background = "rgba(249, 115, 22, 0.2)";
        badge.style.color = "#fdba74";
        feedback.innerText = "You've got the basics down, but a full review of the chapters will help solidify the concepts.";
      } else {
        badge.innerText = "🔄 Re-study";
        badge.style.background = "rgba(239, 68, 68, 0.2)";
        badge.style.color = "#fca5a5";
        feedback.innerText = "Take some time to read through the study material again and try the test once more!";
      }
    }

    function restartQuiz() {
      for (const key in userAnswers) delete userAnswers[key];
      currentIdx = 0;
      document.getElementById('resultsScreen').style.display = 'none';
      document.getElementById('quizScreen').style.display = 'block';
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
