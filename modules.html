<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INACC Space Academy — Space Science Olympiad Preparation</title>
<style>
  :root {
    --bg-dark: #070b19;
    --card-bg: rgba(18, 25, 54, 0.85);
    --card-border: rgba(80, 140, 255, 0.25);
    --primary: #38bdf8;
    --primary-glow: #0284c7;
    --accent: #f59e0b;
    --gold: #fbbf24;
    --purple: #a855f7;
    --green: #22c55e;
    --red: #ef4444;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: var(--font-family);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* Cosmic Background Canvas */
  #starfield {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  /* Container & Layout */
  .app-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header & Navigation */
  header {
    background: rgba(11, 17, 43, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--primary);
    cursor: pointer;
  }
  .cadet-badge {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: rgba(255, 255, 255, 0.05);
    padding: 0.4rem 0.8rem;
    border-radius: 9999px;
    border: 1px solid var(--card-border);
  }
  .avatar-icon {
    font-size: 1.5rem;
    display: inline-block;
  }
  .stats-strip {
    display: flex;
    gap: 1rem;
    font-size: 0.875rem;
    font-weight: 600;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    color: var(--gold);
  }

  nav.top-nav {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding: 0.5rem 1rem;
    background: rgba(7, 11, 25, 0.9);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .nav-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .nav-btn:hover, .nav-btn.active {
    color: var(--primary);
    background: rgba(56, 189, 248, 0.1);
    border-color: rgba(56, 189, 248, 0.3);
  }

  /* Main View Frame */
  main {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* Cards & Glassmorphism */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.5rem;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    margin-bottom: 1.5rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 44px;
    padding: 0.6rem 1.25rem;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    color: #04101e;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
  }
  .btn-accent {
    background: linear-gradient(135deg, var(--accent), #d97706);
    color: #000;
  }
  .btn-purple {
    background: linear-gradient(135deg, var(--purple), #7e22ce);
    color: #fff;
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
  }
  .btn-outline:hover {
    border-color: var(--primary);
    background: rgba(56, 189, 248, 0.08);
  }

  /* Grid Layouts */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }

  /* Section Titles */
  .section-header {
    margin-bottom: 1.25rem;
  }
  .section-header h2 {
    font-size: 1.75rem;
    font-weight: 800;
    background: linear-gradient(to right, #fff, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  .section-header p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* Onboarding Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(3, 7, 18, 0.92);
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 1rem;
  }
  .modal-card {
    background: #0f172a;
    border: 2px solid var(--primary);
    border-radius: 20px;
    padding: 2rem;
    max-width: 550px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 50px rgba(56, 189, 248, 0.3);
  }
  .avatar-picker {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin: 1.25rem 0;
  }
  .avatar-opt {
    font-size: 2rem;
    padding: 0.5rem;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    background: rgba(255, 255, 255, 0.05);
    transition: all 0.2s;
    min-width: 50px;
    min-height: 50px;
  }
  .avatar-opt.selected {
    border-color: var(--primary);
    background: rgba(56, 189, 248, 0.2);
    transform: scale(1.15);
  }

  /* Chapter Card */
  .chapter-box {
    position: relative;
    border-left: 4px solid var(--primary);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .chapter-box:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
  }
  .badge-tag {
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* Interactive Simulations Containers */
  .sim-viewport {
    background: #030712;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    height: 320px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Collapsible / Extra Facts */
  details.fact-drawer {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 0.75rem;
    margin-top: 1rem;
  }
  details.fact-drawer summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--gold);
    user-select: none;
  }

  /* Question & Quiz Interface */
  .quiz-option {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 0.75rem;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s;
  }
  .quiz-option:hover {
    background: rgba(56, 189, 248, 0.1);
    border-color: var(--primary);
  }
  .quiz-option.correct {
    background: rgba(34, 197, 94, 0.2) !important;
    border-color: var(--green) !important;
    color: #4ade80;
  }
  .quiz-option.wrong {
    background: rgba(239, 68, 68, 0.2) !important;
    border-color: var(--red) !important;
    color: #f87171;
  }

  /* Flashcard UI */
  .flashcard-frame {
    perspective: 1000px;
    height: 240px;
    cursor: pointer;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .flashcard-frame.flipped .flashcard-inner {
    transform: rotateY(180deg);
  }
  .flashcard-front, .flashcard-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    border-radius: 16px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  .flashcard-back {
    transform: rotateY(180deg);
    background: #0f172a;
    border-color: var(--primary);
  }

  /* Celebration Overlays */
  #celebrationCanvas {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 2000;
  }

  .toast-banner {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--primary-glow);
    color: #fff;
    padding: 1rem 1.5rem;
    border-radius: 12px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 1500;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .toast-banner.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* Utility */
  .hidden { display: none !important; }
  .text-gold { color: var(--gold); }
  .text-cyan { color: var(--primary); }
  .text-green { color: var(--green); }
  .text-purple { color: var(--purple); }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<canvas id="celebrationCanvas"></canvas>

<!-- Top Notification Toast -->
<div id="toast" class="toast-banner">🚀 Mission Status Confirmed!</div>

<div class="app-container">

  <nav class="top-nav">

    <button class="nav-btn" onclick="navigate('simulations')">🧪 Space Simulators</button>
    <button class="nav-btn" onclick="navigate('minigames')">🎮 Arcade Games</button>
    <button class="nav-btn" onclick="navigate('flashcards')">🗂️ Flashcards</button>
    <button class="nav-btn" onclick="navigate('mistakes')">🧠 Mistake Book</button>
    <button class="nav-btn" onclick="navigate('revision')">🔭 Extra Facts Vault</button>
    <button class="nav-btn" onclick="navigate('simulator-15m')">🚨 15-Min Simulator</button>
    <button class="nav-btn" onclick="navigate('final-test')">🏆 80-Q Master Test</button>
  </nav>

  <!-- Content Container -->
  <main id="viewContainer">
    <!-- Dynamic views injected here -->
  </main>
</div>

<!-- Step-by-Step Onboarding Modal -->
<div id="onboardingModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">👨‍🚀</div>
    <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">WELCOME TO INACC SPACE ACADEMY</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
      Phase 1 National Aerospace Olympiad Preparation Mission
    </p>

    <div id="onboardStep1" style="margin-top: 1.5rem;">
      <p style="font-weight: 600; margin-bottom: 0.75rem;">What is your Cadet Name?</p>
      <input type="text" id="nameInput" placeholder="Enter Explorer Name..." style="width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid var(--card-border); background: #070b19; color: #fff; padding: 0.5rem 1rem; font-size: 1rem; text-align: center; margin-bottom: 1rem;">
      <button class="btn btn-primary" style="width: 100%;" onclick="nextOnboardStep(2)">Confirm Identification ➔</button>
    </div>

    <div id="onboardStep2" class="hidden" style="margin-top: 1.5rem;">
      <p style="font-weight: 600; margin-bottom: 0.5rem;">Select Your Space Avatar:</p>
      <div class="avatar-picker">
        <div class="avatar-opt selected" onclick="selectAvatar(this, '👨‍🚀')">👨‍🚀</div>
        <div class="avatar-opt" onclick="selectAvatar(this, '👩‍🚀')">👩‍🚀</div>
        <div class="avatar-opt" onclick="selectAvatar(this, '🚀')">🚀</div>
        <div class="avatar-opt" onclick="selectAvatar(this, '🤖')">🤖</div>
        <div class="avatar-opt" onclick="selectAvatar(this, '👾')">👾</div>
        <div class="avatar-opt" onclick="selectAvatar(this, '🌟')">🌟</div>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="completeOnboarding()">Launch Space Station 🚀</button>
    </div>
  </div>
</div>

function loadState() {

function saveState() {
  localStorage.setItem("INACC_STATE_V2", JSON.stringify(AppState));

}

function updateHeaderUI() {
  document.getElementById("cadetName").textContent = AppState.cadetName;

function addReward(xpAmt, starAmt, message) {
  AppState.xp += xpAmt;
  AppState.stars += (starAmt || 0);
  saveState();
  showToast(`⚡ +${xpAmt} XP! ${message || ''}`);
  triggerMicroConfetti();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

/* =========================================================================
   CANVAS STARFIELD BACKGROUND
   ========================================================================= */
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let starsArray = [];

function resizeCanvas() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  starsArray = [];
  for (let i = 0; i < 150; i++) {
    starsArray.push({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.01 + 0.005
    });
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animateStars() {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  starCtx.fillStyle = "#ffffff";
  for (let s of starsArray) {
    s.alpha += s.speed;
    if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
    starCtx.globalAlpha = Math.abs(s.alpha);
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fill();
  }
  requestAnimationFrame(animateStars);
}
animateStars();

/* =========================================================================
   CELEBRATION CONFETTI ENGINE (TIER 1 & TIER 3 CELEBRATIONS)
   ========================================================================= */
const celebCanvas = document.getElementById('celebrationCanvas');
const celebCtx = celebCanvas.getContext('2d');
let particles = [];

function triggerMicroConfetti() {
  celebCanvas.width = window.innerWidth;
  celebCanvas.height = window.innerHeight;
  for (let i = 0; i < 35; i++) {
    particles.push({
      x: window.innerWidth / 2 + (Math.random() * 200 - 100),
      y: window.innerHeight / 2 + (Math.random() * 100 - 50),
      vx: (Math.random() - 0.5) * 8,
      vy: Math.random() * -6 - 2,
      size: Math.random() * 6 + 3,
      color: ['#38bdf8', '#fbbf24', '#a855f7', '#4ade80'][Math.floor(Math.random()*4)],
      life: 50
    });
  }
  if (!animatingCeleb) animateCelebration();
}

function triggerBigCelebration(titleText) {
  showToast(`🎉 ${titleText}`);
  celebCanvas.width = window.innerWidth;
  celebCanvas.height = window.innerHeight;
  for (let i = 0; i < 150; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: -20,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * 5 + 3,
      size: Math.random() * 8 + 4,
      color: ['#38bdf8', '#fbbf24', '#f59e0b', '#ec4899', '#22c55e'][Math.floor(Math.random()*5)],
      life: 140
    });
  }
  if (!animatingCeleb) animateCelebration();
}

let animatingCeleb = false;
function animateCelebration() {
  animatingCeleb = true;
  celebCtx.clearRect(0, 0, celebCanvas.width, celebCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    celebCtx.fillStyle = p.color;
    celebCtx.beginPath();
    celebCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    celebCtx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (particles.length > 0) {
    requestAnimationFrame(animateCelebration);
  } else {
    animatingCeleb = false;
    celebCtx.clearRect(0, 0, celebCanvas.width, celebCanvas.height);
  }
}

/* =========================================================================
   VIEW ROUTER & NAVIGATION
   ========================================================================= */
function navigate(viewName, param) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick')?.includes(viewName));
  if (btn) btn.classList.add('active');

  const container = document.getElementById("viewContainer");
  window.scrollTo({ top: 0, behavior: 'smooth' });

  switch (viewName) {
    case 'mission-control':
      renderMissionControl(container);
      break;
    case 'syllabus':
      renderSyllabus(container);
      break;
    case 'chapter-view':
      renderChapterView(container, param || 1);
      break;
    case 'chapter-quiz':
      renderChapterQuiz(container, param || 1);
      break;
    case 'simulations':
      renderSimulations(container);
      break;
    case 'minigames':
      renderMiniGames(container);
      break;
    case 'flashcards':
      renderFlashcards(container);
      break;
    case 'mistakes':
      renderMistakes(container);
      break;
    case 'revision':
      renderRevisionVault(container);
      break;
    case 'simulator-15m':
      render15MinSimulator(container);
      break;
    case 'final-test':
      render80QMasterTest(container);
      break;
    default:
      renderMissionControl(container);
  }
}

function handleQuizAnswer(selectedIdx, correctIdx, expEncoded) {
  if (currentQuizState.answered) return;
  currentQuizState.answered = true;
  const exp = decodeURIComponent(expEncoded);
  const q = currentQuizState.questions[currentQuizState.currentIndex];

  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach((o, i) => {
    if (i === correctIdx) o.classList.add('correct');
    if (i === selectedIdx && i !== correctIdx) o.classList.add('wrong');
  });

  const fb = document.getElementById('quizFeedback');
  const fbText = document.getElementById('feedbackText');
  const expText = document.getElementById('explanationText');
  fb.classList.remove('hidden');

  if (selectedIdx === correctIdx) {
    currentQuizState.score++;
    addReward(15, 1, "Correct Answer!");
    fbText.innerHTML = `<span class="text-green">✅ Outstanding, ${AppState.cadetName}! Correct answer.</span>`;
  } else {
    fbText.innerHTML = `<span style="color:var(--red);">❌ Not quite this time. Let's analyze!</span>`;
    // Log to Mistake Notebook
    if (!AppState.mistakes.find(m => m.id === q.id)) {
      AppState.mistakes.push({
        id: q.id,
        q: q.q,
        userAns: q.opts[selectedIdx],
        correctAns: q.opts[correctIdx],
        exp: exp
      });
      saveState();
    }
  }
  expText.textContent = `Explanation: ${exp}`;
}

function nextQuizQuestion() {

// Orbit canvas variables
let orbitSim = {
  speed: 5,
  angle: 0,
  distance: 90,
  running: true
};

function initOrbitSim() {
  const canvas = document.getElementById('orbitCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Earth
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "10px sans-serif";
    ctx.fillText("Earth", cx - 12, cy + 3);

    // Satellite position based on speed
    if (orbitSim.speed < 4) {
      // Crash
      orbitSim.distance = Math.max(30, orbitSim.distance - 0.3);
    } else if (orbitSim.speed > 7.5) {
      // Escape
      orbitSim.distance += 0.8;
    } else {
      // Stable
      orbitSim.distance = 95;
    }

    orbitSim.angle += (orbitSim.speed * 0.008);
    const sx = cx + Math.cos(orbitSim.angle) * orbitSim.distance;
    const sy = cy + Math.sin(orbitSim.angle) * orbitSim.distance;

    // Orbit trail
    ctx.strokeStyle = "rgba(56, 189, 248, 0.3)";
    ctx.beginPath();
    ctx.arc(cx, cy, orbitSim.distance, 0, Math.PI * 2);
    ctx.stroke();

    // Satellite
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(sx, sy, 6, 0, Math.PI * 2);
    ctx.fill();

    if (document.getElementById('orbitCanvas')) requestAnimationFrame(draw);
  }
  draw();
}

function updateOrbitSpeed(val) {
  orbitSim.speed = parseFloat(val);
  document.getElementById('speedVal').textContent = val;
}

function resetOrbitSim() {
  orbitSim.distance = 95;

        ${q.opts.map((opt, i) => `
          <div class="quiz-option ${chosen === i ? 'correct' : ''}" onclick="pick15mAnswer(${q.id}, ${i})">
            <span style="font-weight:700;">${['A','B','C','D'][i]}.</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:1.5rem;">
        <button class="btn btn-outline" onclick="change15mQ(-1)" ${sim15mState.currentIndex === 0 ? 'disabled' : ''}>Previous</button>
        <button class="btn btn-primary" onclick="change15mQ(1)">${sim15mState.currentIndex === total - 1 ? 'Finish Drill ➔' : 'Next ➔'}</button>
      </div>
    </div>
  `;
}

function pick15mAnswer(qid, optIdx) {
  sim15mState.answers[qid] = optIdx;
  render15mQuestion(document.getElementById("viewContainer"));
}

function change15mQ(delta) {
  sim15mState.currentIndex += delta;
  if (sim15mState.currentIndex >= sim15mState.questions.length) {
    submit15mExam();
  } else {
    render15mQuestion(document.getElementById("viewContainer"));
  }
}

function submit15mExam() {
  clearInterval(sim15mState.timer);
  let correct = 0;
  sim15mState.questions.forEach(q => {
    if (sim15mState.answers[q.id] === q.ans) correct++;
  });
  const total = sim15mState.questions.length;
  const pct = Math.round((correct / total) * 100);

  addReward(correct * 10, 2, "15-Min Test Completed");
  if (pct >= 85) triggerBigCelebration(`Outstanding Performance, ${AppState.cadetName}! ${pct}% Score!`);

  document.getElementById("viewContainer").innerHTML = `
    <div class="card" style="text-align:center; padding:2.5rem 1.5rem;">
      <div style="font-size:3.5rem;">📊</div>
      <h2 style="color:#fff; margin-top:0.5rem;">15-Minute Simulator Mission Report</h2>
      <p style="font-size:1.8rem; font-weight:800; color:var(--primary); margin:0.75rem 0;">
        ${correct} / ${total} Correct (${pct}%)
      </p>
      <p style="color:var(--text-muted); max-width:500px; margin:0 auto 1.5rem;">
        Pace: ~${Math.round((900 - sim15mState.secondsLeft)/total)} seconds/question.
      </p>
      <button class="btn btn-primary" onclick="navigate('mission-control')">Back to Mission Control</button>
    </div>
  `;
}

/* =========================================================================
   11. 80-QUESTION MASTER TEST
   ========================================================================= */
let masterTestState = {
  currentIndex: 0,
  answers: {}
};

function render80QMasterTest(el) {
  masterTestState = { currentIndex: 0, answers: {} };
  el.innerHTML = `
    <div class="card" style="text-align:center; padding:2.5rem 1.5rem;">
      <div style="font-size:3.5rem;">🏆</div>
      <h2 style="color:#fff; margin-top:0.5rem;">80-QUESTION MASTER OLYMPIAD BENCHMARK</h2>
      <p style="color:var(--text-muted); max-width:550px; margin:0.5rem auto 1.5rem;">
        The authoritative comprehensive examination containing all 80 questions across all 8 study chapters.
      </p>
      <button class="btn btn-primary" style="padding:0.8rem 2rem; font-size:1.1rem;" onclick="renderMasterQ(0)">
        Begin Master Examination (80 Questions) 🚀
      </button>
    </div>
  `;
}

function renderMasterQ(idx) {
  masterTestState.currentIndex = idx;
  const q = INACC_OFFICIAL_80_MCQS[idx];
  const total = INACC_OFFICIAL_80_MCQS.length;
  const chosen = masterTestState.answers[q.id];

  document.getElementById("viewContainer").innerHTML = `
    <div style="margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center;">
      <span class="badge-tag">CHAPTER ${q.ch} • QUESTION ${idx + 1} OF ${total}</span>
      <button class="btn btn-outline" style="padding:0.3rem 0.8rem;" onclick="finishMasterTest()">Submit Master Exam</button>
    </div>

    <div class="card" style="border-color:var(--primary);">
      <div style="font-size:1.2rem; font-weight:700; margin-bottom:1.25rem; color:#fff;">
        ${q.q}
      </div>

      <div>
        ${q.opts.map((opt, i) => `
          <div class="quiz-option ${chosen === i ? 'correct' : ''}" onclick="pickMasterAns(${q.id}, ${i})">
            <span style="font-weight:700;">${['A','B','C','D'][i]}.</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:1.5rem;">
        <button class="btn btn-outline" onclick="renderMasterQ(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>Previous</button>
        <button class="btn btn-primary" onclick="${idx === total - 1 ? 'finishMasterTest()' : `renderMasterQ(${idx + 1})`}">${idx === total - 1 ? 'Submit Test ➔' : 'Next ➔'}</button>
      </div>
    </div>
  `;
}

function pickMasterAns(qid, optIdx) {
  masterTestState.answers[qid] = optIdx;
  renderMasterQ(masterTestState.currentIndex);
}

function finishMasterTest() {
  let score = 0;
  INACC_OFFICIAL_80_MCQS.forEach(q => {
    if (masterTestState.answers[q.id] === q.ans) score++;
  });
  const total = INACC_OFFICIAL_80_MCQS.length;
  const pct = Math.round((score / total) * 100);

  addReward(score * 10, 10, "Master Test Completed!");
  if (pct >= 85) triggerBigCelebration(`OLYMPIAD CHAMPION! Cadet ${AppState.cadetName} scored ${pct}%!`);

  document.getElementById("viewContainer").innerHTML = `
    <div class="card" style="text-align:center; padding:2.5rem 1.5rem;">
      <div style="font-size:3.5rem;">🏆</div>
      <h2 style="color:#fff; margin-top:0.5rem;">Master Olympiad Performance Report</h2>
      <p style="font-size:2rem; font-weight:800; color:var(--gold); margin:0.75rem 0;">
        ${score} / ${total} Correct (${pct}%)
      </p>
      <p style="color:var(--text-muted); max-width:500px; margin:0 auto 1.5rem;">
        ${pct >= 80 ? 'Exceptional readiness for the INACC National Aerospace Olympiad!' : 'Good effort! Review the flashcards and specific chapter lessons to master every concept.'}
      </p>
      <button class="btn btn-primary" onclick="navigate('mission-control')">Return to Mission Control</button>
    </div>
  `;
}

/* =========================================================================
   ONBOARDING FLOW
   ========================================================================= */
let tempAvatar = "👨‍🚀";

function checkFirstRun() {
  const saved = localStorage.getItem("INACC_STATE_V2");
  if (!saved) {
    document.getElementById("onboardingModal").classList.remove("hidden");
  }
}

function nextOnboardStep(step) {
  const name = document.getElementById("nameInput").value.trim();
  if (name) AppState.cadetName = name;
  document.getElementById("onboardStep1").classList.add("hidden");
  document.getElementById("onboardStep2").classList.remove("hidden");
}

function selectAvatar(el, av) {
  document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  tempAvatar = av;
}

function completeOnboarding() {
  AppState.avatar = tempAvatar;
  saveState();
  document.getElementById("onboardingModal").classList.add("hidden");
  triggerBigCelebration(`Welcome Cadet ${AppState.cadetName}! Launching Station!`);
  navigate('mission-control');
}

/* =========================================================================
   BOOTSTRAP APPLICATION
   ========================================================================= */
window.addEventListener('DOMContentLoaded', () => {
  loadState();
  checkFirstRun();
  navigate('mission-control');
});
</script>
